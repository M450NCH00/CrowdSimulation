# Scenario registry. Anchored to what CrowdGym can already build (planes / zones /
# points / obstacles / journeys) and to the RiMEA cases the senior already tested,
# so the resulting behaviour records plug straight into the simulation.
#
# geometry fields feed CrowdGym scenario construction directly:
#   plane_size_m       [w, h] of the plane
#   passage_width_m    narrowest relevant opening
#   num_exits          number of exit zones
#   exit_width_m       width of each exit zone (list or scalar)
#   layout             short human note for the scenario builder
# agents_involved: "pair" | "few" (3-8) | "many" (>=20)
# conflict_type:   "deadlock" | "congestion" | "resource_competition" | "none"

version: 1
country: Singapore

scenarios:

  # ---------------- CONFLICT SCENARIOS (core of the FYP) ----------------

  - id: bottleneck_doorway_bidirectional
    name: Narrow doorway used from both sides
    category: conflict
    description: >
      A single doorway roughly one person wide connects two areas. People want to
      pass through it in both directions at the same time. Two people arrive at
      the doorway from opposite sides at the same moment and cannot both fit.
    sg_variant: >
      e.g. a shophouse five-foot-way gap, a coffee shop entrance, or a single
      turnstile-free side gate at an MRT station during off-peak.
    geometry: { plane_size_m: [10, 6], passage_width_m: 0.9, num_exits: 2, exit_width_m: 2.0,
                layout: "two rooms joined by one 0.9 m x 1.5 m doorway; spawn in each room" }
    agents_involved: pair
    conflict_type: deadlock
    rimea_ref: "adapted from RiMEA Test 12 (bottleneck), reduced to a pair"
    expected_actions: [proceed, halt, yield_step_aside, back_off, speed_up]
    decision_factors: [who committed to the doorway first, who is carrying more,
                       relative age and frailty, eye contact and gestures, how busy it is]

  - id: bottleneck_exit_congestion
    name: Many people to one narrow exit
    category: conflict
    description: >
      A crowd in a room all needs to leave through one narrow exit. People
      accumulate in front of the opening and must merge into a single file to get
      through. Describe how one person behaves while stuck in this crowd at the
      exit.
    sg_variant: >
      e.g. leaving a lecture theatre, a cinema hall at Golden Village, or a bus
      after it reaches an interchange.
    geometry: { plane_size_m: [12, 12], passage_width_m: 1.0, num_exits: 1, exit_width_m: 1.0,
                layout: "RiMEA Test 12: room with 50 agents, single 1.0 m exit; also test 1.5 m" }
    agents_involved: many
    conflict_type: congestion
    rimea_ref: "RiMEA Test 12"
    expected_actions: [slow, halt, proceed, yield_step_aside, speed_up]
    decision_factors: [density and pushing around them, whether a gap opens,
                       politeness vs urgency, presence of staff or signage, children nearby]

  - id: corner_turn_90
    name: Rounding a 90-degree corridor corner
    category: conflict
    description: >
      A corridor turns sharply through ninety degrees. People walking through tend
      to cut the inside of the corner, which bunches them up against others coming
      the other way or already turning. Describe how one person negotiates the
      corner when others are near the apex.
    sg_variant: >
      e.g. an underpass turn at an MRT station, an HDB void deck corner, a mall
      corridor bend near the toilets.
    geometry: { plane_size_m: [14, 14], passage_width_m: 2.0, num_exits: 1, exit_width_m: 2.0,
                layout: "L-shaped corridor 2 m wide; optional guide zone at the inner corner" }
    agents_involved: few
    conflict_type: congestion
    rimea_ref: "RiMEA Test 6 (no wall clipping) + Test 15 (time vs volume)"
    expected_actions: [proceed, slow, yield_step_aside]
    decision_factors: [line of sight around the corner, who is on the inside line,
                       walking speed difference, whether they are in a group]

  - id: crossflow_intersection
    name: Two pedestrian streams crossing at right angles
    category: conflict
    description: >
      Two steady streams of people cross each other at a right angle in an open
      area, with no markings telling anyone who has priority. Describe how one
      person in one stream moves through the crossing point.
    sg_variant: >
      e.g. the open concourse at a large MRT interchange (Dhoby Ghaut, Jurong
      East), or a crossing of walkways in a large mall atrium.
    geometry: { plane_size_m: [16, 16], passage_width_m: 4.0, num_exits: 2, exit_width_m: 4.0,
                layout: "two 4 m corridors crossing; spawn streams on all four arms" }
    agents_involved: many
    conflict_type: congestion
    rimea_ref: "adapted from the senior's Crossflow verification scenario"
    expected_actions: [proceed, slow, yield_step_aside, speed_up]
    decision_factors: [gap timing in the other stream, local convention of giving way,
                       speed matching, forming a diagonal lane, eye contact]

  - id: counterflow_corridor
    name: Bidirectional flow in a straight corridor
    category: conflict
    description: >
      A corridor carries roughly equal numbers of people in both directions.
      People tend to sort themselves into lanes. Describe how one person chooses
      which side to walk on and how they react to oncoming people.
    sg_variant: >
      e.g. a linked-building bridge (CityLink Mall), a covered walkway between HDB
      blocks, an MRT platform-to-exit corridor at peak hour.
    geometry: { plane_size_m: [20, 3], passage_width_m: 3.0, num_exits: 2, exit_width_m: 3.0,
                layout: "3 m x 20 m corridor; opposing spawn zones at each end" }
    agents_involved: many
    conflict_type: congestion
    rimea_ref: "lane-formation (Feliciani & Nishinari); JuPedSim lane demo"
    expected_actions: [proceed, slow, yield_step_aside]
    decision_factors: [which side is conventional locally, existing lanes,
                       walking speed, oncoming groups walking abreast]

  - id: overtake_slow_walker
    name: Overtaking a slower walker in a narrow space
    category: conflict
    description: >
      A faster person comes up behind a slower person in a corridor that is only
      wide enough for about one and a half people. Describe how the faster person
      behaves and how the slower person reacts.
    sg_variant: >
      e.g. squeezing past someone on a covered walkway, or on a narrow HDB
      corridor, or on a park connector shared with joggers.
    geometry: { plane_size_m: [18, 1.6], passage_width_m: 1.6, num_exits: 1, exit_width_m: 1.6,
                layout: "1.6 m x 18 m corridor; one slow agent ahead, one fast agent behind" }
    agents_involved: pair
    conflict_type: resource_competition
    rimea_ref: "n/a"
    expected_actions: [slow, proceed, speed_up, yield_step_aside]
    decision_factors: [is there room to pass, oncoming traffic, saying excuse me,
                       whether the slow walker notices and moves aside, urgency]

  - id: merge_two_corridors
    name: Two corridors merging into one
    category: conflict
    description: >
      Two corridors join into a single corridor of the same width, so the two
      flows must merge. Describe how one person from one branch merges with the
      flow from the other branch.
    sg_variant: >
      e.g. two escalator exits feeding one walkway, two HDB staircases feeding a
      void deck, ramp and stairs meeting at a linkway.
    geometry: { plane_size_m: [16, 10], passage_width_m: 2.5, num_exits: 1, exit_width_m: 2.5,
                layout: "Y-merge, each branch 2.5 m, trunk 2.5 m" }
    agents_involved: many
    conflict_type: congestion
    rimea_ref: "n/a"
    expected_actions: [proceed, slow, yield_step_aside, halt]
    decision_factors: [zipper-merge alternation, who arrived at the merge point first,
                       speed, group cohesion]

  - id: lift_boarding_capacity
    name: Boarding a nearly full lift
    category: conflict
    description: >
      A lift arrives and it is already mostly full. Several people are waiting to
      get in and only one or two more can fit. Describe how one waiting person
      behaves.
    sg_variant: >
      e.g. an HDB block lift at morning peak, a mall lift with a pram and shopping
      trolleys, a hospital lift.
    geometry: { plane_size_m: [4, 4], passage_width_m: 1.1, num_exits: 1, exit_width_m: 1.1,
                layout: "lift car as a small zone (1.4 x 1.4 m) with a 1.1 m door; lobby waiting zone" }
    agents_involved: few
    conflict_type: resource_competition
    rimea_ref: "n/a"
    expected_actions: [proceed, halt, yield_step_aside, reroute]
    decision_factors: [how full the lift is, letting people exit first, who has been
                       waiting longest, having a pram / wheelchair / heavy load,
                       whether stairs are a realistic alternative, how many floors]

  - id: escalator_entry_merge
    name: Stepping onto a busy escalator
    category: conflict
    description: >
      People queue loosely to step onto an escalator one at a time. Describe how
      one person times their step on when others are close behind and in front.
    sg_variant: >
      e.g. an MRT station escalator at peak; note local campaigns discouraging the
      old keep-left / walk-right habit and asking people to stand on both sides.
    geometry: { plane_size_m: [8, 3], passage_width_m: 1.0, num_exits: 1, exit_width_m: 1.0,
                layout: "approach zone funnelling to a 1.0 m escalator mouth" }
    agents_involved: many
    conflict_type: congestion
    rimea_ref: "n/a"
    expected_actions: [proceed, slow, halt, speed_up]
    decision_factors: [step timing, standing one side vs both sides, luggage or bags,
                       holding the handrail, children or elderly in the group]

  - id: multi_exit_evacuation
    name: Leaving a room with several exits of different sizes
    category: conflict
    description: >
      A room has several exits of different widths on different walls. Everyone
      needs to leave. Describe how one person chooses which exit to head for and
      whether they would change their mind partway.
    sg_variant: >
      e.g. evacuating a food court, a school hall, or an office floor during a
      fire drill.
    geometry: { plane_size_m: [15, 15], passage_width_m: 1.0, num_exits: 4,
                exit_width_m: [1.0, 1.3, 1.7, 2.0],
                layout: "the senior's RL scenario: 15 m room, 4 exits, widths randomised from [1.0..2.0]" }
    agents_involved: many
    conflict_type: congestion
    rimea_ref: "senior's RL exit-selection scenario (Xu et al.; Shi et al.)"
    expected_actions: [proceed, reroute, slow, halt]
    decision_factors: [distance to each exit, how crowded each exit already looks,
                       exit width, following the crowd vs known routes, signage,
                       staff directions]

  # ---------------- EVERYDAY SCENARIOS (coverage, not just conflict) ----------------

  - id: signalised_crossing
    name: Crossing a road at a signalised junction
    category: everyday
    description: >
      People wait at a pedestrian crossing for the green man, then cross together.
      Describe how one person behaves from arriving at the kerb to reaching the
      other side.
    sg_variant: >
      e.g. a Singapore traffic-light crossing with a countdown timer and a
      push-button; green-man extension tap for seniors at some junctions.
    geometry: { plane_size_m: [12, 8], passage_width_m: 4.0, num_exits: 2, exit_width_m: 4.0,
                layout: "two kerb waiting zones, a 4 m x 8 m crossing strip between them" }
    agents_involved: many
    conflict_type: none
    rimea_ref: "n/a"
    expected_actions: [halt, proceed, speed_up, slow]
    decision_factors: [signal state and countdown, traffic, others starting to cross,
                       jaywalking tolerance, walking speed, phone use]

  - id: bus_queue_boarding
    name: Queuing for a bus and boarding
    category: everyday
    description: >
      People form a queue at a bus stop. The bus arrives and stops with its door
      near the front of the queue. Describe how one person in the queue behaves
      while waiting and while boarding.
    sg_variant: >
      e.g. a Singapore bus stop with a marked queue line; tapping the farecard on
      boarding; priority for elderly and wheelchair users.
    geometry: { plane_size_m: [10, 3], passage_width_m: 0.9, num_exits: 1, exit_width_m: 0.9,
                layout: "queue lane along a shelter; bus door as a 0.9 m boarding zone" }
    agents_involved: many
    conflict_type: resource_competition
    rimea_ref: "n/a"
    expected_actions: [halt, proceed, slow, yield_step_aside]
    decision_factors: [queue position and discipline, where the door stops,
                       letting alighting passengers off first, farecard ready,
                       priority for elderly, bus filling up]

  - id: mrt_door_alight_board
    name: Alighting vs boarding at a train door
    category: everyday
    description: >
      A train stops at a platform. Some people want to get off through the door
      while others on the platform want to get on. Describe how one boarding
      person and how one alighting person behave at the door.
    sg_variant: >
      e.g. an MRT door with floor markings that ask boarders to keep to the sides
      and let people alight first; platform screen doors.
    geometry: { plane_size_m: [6, 4], passage_width_m: 1.4, num_exits: 2, exit_width_m: 1.4,
                layout: "train-side zone and platform-side zone joined by a 1.4 m door; markings on platform" }
    agents_involved: many
    conflict_type: deadlock
    rimea_ref: "n/a"
    expected_actions: [halt, yield_step_aside, proceed, speed_up]
    decision_factors: [following the alight-first convention, door markings,
                       time pressure before the door closes, how full the train is,
                       crowd behind pushing]

  - id: covered_walkway_walking
    name: Ordinary walking on a covered walkway
    category: everyday
    description: >
      A covered walkway at light-to-moderate density with people walking at a
      range of speeds in both directions. Describe how one person walks: speed,
      spacing they keep, and how they pass others.
    sg_variant: >
      e.g. an HDB linkway or a walkway to an MRT station; sheltered from sun and
      sudden rain; may be shared with cyclists on some stretches.
    geometry: { plane_size_m: [30, 2.5], passage_width_m: 2.5, num_exits: 2, exit_width_m: 2.5,
                layout: "2.5 m x 30 m covered walkway, mixed-direction spawn at both ends" }
    agents_involved: few
    conflict_type: none
    rimea_ref: "RiMEA Test 1 (free walking speed) as a sanity baseline"
    expected_actions: [proceed, slow, yield_step_aside, speed_up]
    decision_factors: [preferred personal space, walking speed, phone use,
                       weather (sudden rain crowding the shelter), cyclists]

# Issue #30, Part 2: the baseline runs that conflict cases are taken from. Two groups of 50
# walking through each other along a 4 m walkway, under the primary baseline (plain ORCA,
# perturbed, 40 neighbours). No model is called. Each run takes about a minute.
#
#   python run_experiment.py configs/cases/source_bidirectional_flow.yaml
#
# Thousands of pair interactions per run, of every tier; the case extractor samples a few.
# The trajectory keeps every tenth step; the pair and interaction records are complete,
# and they are all a case is read from.
schema_version: 1
layer: avoidance
experiment_name: si3_source_bidirectional_flow
description: Conflict-case source. The two-way flow of 100 agents, primary baseline, plain ORCA.
scenario: configs/scenarios/bidirectional_flow.yaml
baseline: orca_perturbed_v1

logging:
  trajectory_stride: 10

design:
  seed: 30500
  seeding: paired
  repeats: 2

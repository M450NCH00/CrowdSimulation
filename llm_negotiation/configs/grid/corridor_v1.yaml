# Issue #139 (RF-50): the grid corridor, an add-on world (AS1, docs/action-space.md section 8).
# Read only by negsim.grid; no other layer reads this folder.
#
#   python -m negsim.grid scripts            # every scripted pair on round 1's geometries
#   python -m negsim.grid run --script keep_right --geometry aligned --seed 1 --print
#
# Every number carries one of the repo's tags (docs/parameters.md uses the same ones):
#   [cited: ...]    read in a source
#   [derived: ...]  worked out from cited values by the rule given
#   [placeholder]   a round, plausible value with no source. Not to be reported as sourced.
#   [design]        a choice about the scene or the numerics, not a physical quantity
schema_version: 1
type: grid_corridor
description: >
  Two people walk toward each other along a corridor cut into square cells. Each person takes one
  cell; a tick moves one cell at walking speed.

cell_m: 0.4                    # m    side of a cell: "approximately 40 x 40 cm^2 ... the typical space occupied by a pedestrian in a dense crowd"   [cited: Burstedde et al. 2001, sec. 2; refs/rf42_burstedde2001_ca_arxiv.txt:132-135] (AS6)
lanes: 5                       #      cells across, so 2.0 m wide; round 1's corridor is 1.75 m. The centre lane lets an aligned start fit   [design] (AS6)
rows: 50                       #      cells along, so 20 m long, as round 1's corridor   [design] (AS6)
start_cells_from_middle: 20    #      each person starts in the 20th cell from the middle (8 m, round 1's start_distance)   [design] (AS6)
reference_speed_mps: 1.3       # m/s  the speed that moves one cell a tick; measured 1.29 +/- 0.19   [cited: Moussaid et al. 2009, Sec 2(c) and 4(a)]
                               #      tick = cell_m / reference_speed_mps = 0.3077 s; Burstedde et al. give "approximately 0.3 sec"   [derived] (AS6)
max_time_s: 60.0               # s    the run is a timeout after this, as round 1's corridor (195 ticks)   [design]
deadlock_window_s: 3.0         # s    no one advances towards their goal for this long: a deadlock. Issue #24's window, as round 1's corridor (10 ticks)   [placeholder] (accepted by the user 2026-11-26; docs/action-space.md section 11)
body_radius_m: 0.25            # m    half the effective shoulder width of 49.8 cm, as round 1's corridor. Passing in adjacent lanes (0.4 m) is closer than two bodies   [cited: Yamamoto et al. 2019, Sec 4.3]

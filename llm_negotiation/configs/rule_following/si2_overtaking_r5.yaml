# Issue #28, sensitivity check: si2_overtaking again, with a sensing radius of 5 m instead of
# the baselines' 12.5 m. Rule-following against both baselines, 20 seeds per condition. No
# model is called.
#
#   python run_experiment.py configs/rule_following/si2_overtaking_r5.yaml
#
# The two start 4 m apart, inside 5 m, so they perceive each other from the first step at
# either radius.
schema_version: 1
layer: avoidance
experiment_name: si2_overtaking_r5
description: The overtaking of si2_overtaking with a sensing radius of 5 m (sensitivity check).
scenario: configs/scenarios/overtaking.yaml
scenario_overrides:
  agent_types:
    pedestrian:
      sensing_radius: 5.0      # m  the value in Menge's example; sensitivity check only   [placeholder]

logging:
  trajectory_stride: 10

design:
  seed: 28450
  repeats: 20
  factors:
    layout:
      - name: directly_behind
      - name: offset
        scenario_overrides: {geometry: {lateral_offsets: [0.05, 0.0]}}
    baseline:
      - name: perturbed
        baseline: orca_perturbed_v1
      - name: unperturbed
        baseline: orca_unperturbed_v1
    mode:
      - name: plain
      - name: rules
        directives: {provider: rules, ruleset: default}

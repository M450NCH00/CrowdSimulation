# Issue #28, sensitivity check: si2_head_on again, with a sensing radius of 5 m instead of
# the baselines' 12.5 m. Rule-following against both baselines, 20 seeds per condition. No
# model is called.
#
#   python run_experiment.py configs/rule_following/si2_head_on_r5.yaml
#
# The 5 m is laid on top of the baseline (docs/baseline.md, section 5); every run records
# both. The trajectory keeps every tenth step; everything else is complete.
schema_version: 1
layer: avoidance
experiment_name: si2_head_on_r5
description: The head-on of si2_head_on with a sensing radius of 5 m (sensitivity check).
scenario: configs/scenarios/wide_corridor_head_on.yaml
personas: configs/personas/personas.yaml
scenario_overrides:
  agent_types:
    pedestrian:
      sensing_radius: 5.0      # m  the value in Menge's example; sensitivity check only   [placeholder]

logging:
  trajectory_stride: 10

design:
  seed: 28150
  repeats: 20
  factors:
    layout:
      - name: symmetric
      - name: offset
        scenario_overrides: {geometry: {lateral_offsets: [0.05, -0.05]}}
    people:
      - name: no_personas
      - name: f25_m70
        population: {agents: {0: {persona: f25}, 1: {persona: m70}}}
    baseline:
      - name: perturbed
        baseline: orca_perturbed_v1
      - name: unperturbed
        baseline: orca_unperturbed_v1
    mode:
      - name: plain
      - name: rules
        directives: {provider: rules, ruleset: default}

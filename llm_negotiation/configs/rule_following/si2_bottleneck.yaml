# Issue #28, behaviour checks: a wide corridor into a single-file segment, with the arbiter.
# Rule-following against both baselines, 20 seeds per condition. No model is called.
#
#   python run_experiment.py configs/rule_following/si2_bottleneck.yaml
#
# The rule that applies at the segment is single_file_first_arrival. In issue #26's two
# layouts the two would reach the segment at the same time, a tie, on which the rule does not
# apply and the arbiter's own rule decides; so each layout is also run with agent 0 walking
# more slowly (1.10 m/s, the slower walker of the overtaking scenario), which puts agent 1
# about a second ahead.
schema_version: 1
layer: avoidance
experiment_name: si2_bottleneck
description: A wide corridor into a single-file segment. Plain ORCA against the default rule set, on both baselines.
scenario: configs/scenarios/corridor_to_bottleneck.yaml

logging:
  trajectory_stride: 10

design:
  seed: 28500
  repeats: 20
  factors:
    flow:
      - name: opposing
      - name: merging
        scenario_overrides: {geometry: {flow: merging}}
    speeds:
      - name: equal
      - name: agent_0_slower
        scenario_overrides: {agents: {overrides: {0: {preferred_speed: 1.10}}}}   # m/s  [derived: Moussaid et al. 2009, Sec 4(a), mean minus one s.d.]
    baseline:
      - name: perturbed
        baseline: orca_perturbed_v1
      - name: unperturbed
        baseline: orca_unperturbed_v1
    mode:
      - name: plain
      - name: rules
        directives: {provider: rules, ruleset: default}

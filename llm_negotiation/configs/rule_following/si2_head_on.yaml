# Issue #28, behaviour checks: head-on in a corridor wide enough to pass. Rule-following
# against both baselines, 20 seeds per condition. No model is called.
#
#   python run_experiment.py configs/rule_following/si2_head_on.yaml
#
# Without personas the rule that applies is keep_left_head_on; with a woman of 25 and a man
# of 70, younger_yields_head_on outranks it (priority 20). The trajectory keeps every tenth
# step; everything else is complete.
schema_version: 1
layer: avoidance
experiment_name: si2_head_on
description: Head-on in a wide corridor. Plain ORCA against the default rule set, on both baselines.
scenario: configs/scenarios/wide_corridor_head_on.yaml
personas: configs/personas/personas.yaml

logging:
  trajectory_stride: 10

design:
  seed: 28100
  repeats: 20
  factors:
    layout:
      - name: symmetric
      - name: offset
        scenario_overrides: {geometry: {lateral_offsets: [0.05, -0.05]}}
    people:
      - name: no_personas
      - name: f25_m70
        population: {agents: {0: {persona: f25}, 1: {persona: m70}}}
    baseline:
      - name: perturbed
        baseline: orca_perturbed_v1
      - name: unperturbed
        baseline: orca_unperturbed_v1
    mode:
      - name: plain
      - name: rules
        directives: {provider: rules, ruleset: default}

# Issue #100 (RF-28): round 1, head-on in a corridor: does a stronger model resolve it?
#
#   python run_experiment.py configs/resolution/round1_head_on_v4pro_cap600.yaml --plan
#   python run_experiment.py configs/resolution/round1_head_on_v4pro_cap600.yaml --out runs_mock/rf28_cap600   # mock rehearsal
#
# PAID RUN: approved by the user for issue #100 only, 2026-10-25, cap USD 0.30 (CLAUDE.md, pending
# item 1). This config names the mock client; the paid run is
#   python run_experiment.py configs/resolution/round1_head_on_v4pro_cap600.yaml --client deepseek --confirm
# off-peak. The cap: 96 sessions at RF-27's measured tokens and v4-pro's off-peak prices is about
# USD 0.19, with headroom for longer replies.
#
# RF-27's config (configs/resolution/round1_head_on_v7.yaml), which reproduces RF-10's 96
# independent sessions (cells, people, seeds; RF-10's counterfactual pairs kept so that the
# balanced ethnicity draw gives the same people), with two changes:
# - templates.core: resolve_v6, RF-10's own (the user's choice), so the comparison is RF-10's
#   independent sessions against these with only the model changed;
# - llm.model: deepseek-v4-pro (the user's choice of 2026-10-25, before any OpenAI model).
# Temperature 1.0 and thinking off are unchanged.
#
# THE RUN OF RECORD for issue #100 (the user's decision of 2026-10-25). The first config,
# round1_head_on_v4pro.yaml, ran 6 sessions (USD 0.0116): v4-pro pretty-prints its JSON, and 1 of
# its 12 replies was cut off at the 300-token cap on both attempts. This config is that one with
# max_tokens 600 under a new experiment name (a resumed run must keep its config). The cap is a
# ceiling: a reply that fits is unchanged, and only the tokens written are paid for. So against
# RF-10 two things differ: the model and the ceiling, which flash never came near (largest reply
# 214 tokens in RF-9).
# Perceived attractiveness and real ethnicity are on, as in RF-10: both ethics sign-offs are
# recorded in CLAUDE.md (2026-10-24). No rule may read either.
schema_version: 1
layer: resolution
experiment_name: rf28_round1_head_on_v4pro_cap600
description: >-
  RF-28, round 1 (head-on), with a reply cap of 600: RF-10's design in the independent condition only, on
  deepseek-v4-pro in place of deepseek-flash, with RF-10's core template resolve_v6; the same 32
  cells, 2 geometries, exact-repeat set and counterfactual pairs; the gate unchanged at 0.50.

conditions: [independent]   # the cheapest; RF-10 found no difference between conditions

design:
  kind: fractional
  cells: 32
  seed: 65
  base_age: 25
  age_difference: 45
  ethnicity_draw: balanced
  geometries:
    - head_on_de176842@2   # wide_corridor_head_on, walking lines aligned (0 cm apart)
    - head_on_02dfbadb@2   # the same, walking lines 20 cm apart
  exact_repeats:
    cells: 8
    times: 3
  factors:
    age_pair: [same, p1_older]
    gender_pair: [p1_female, p1_male]
    urgency: [neither, p1]
    mobility_aid: [neither, p1]
    load: [neither, p1]
    distraction: [neither, p1]
    assertiveness: [neither, p1]
    residence: [neither, p1]
    memory_note: [neither, p1]
    attractiveness_0_sees_1: [unremarkable, attractive]   # how person 1 sees person 2
    attractiveness_1_sees_0: [unremarkable, attractive]   # how person 2 sees person 1
    familiarity: [strangers, acquaintances]
    ethnicity_pair: [same, different]
    surroundings: [quiet, busy]
    time_of_day: [daytime, late_night]
    mapping: [p1_lower, p1_higher]
    demographics_visible: [true]
    ethnicity_visible: [true]
    attractiveness_visible: [true]
  # RF-10's four pairs, kept so that the balanced ethnicity draw, which rotates the groups over
  # every unit of the design, pairs included, gives every session RF-10's people.
  counterfactual_pairs:
    # The same session but person 2's group differs (same to different), person 1's kept.
    - base: &base
        age_pair: same
        gender_pair: p1_female
        urgency: neither
        mobility_aid: neither
        load: neither
        distraction: neither
        assertiveness: neither
        residence: neither
        memory_note: neither
        attractiveness_0_sees_1: unremarkable
        attractiveness_1_sees_0: unremarkable
        familiarity: strangers
        ethnicity_pair: same
        surroundings: quiet
        time_of_day: daytime
        mapping: p1_lower
      factor: ethnicity_pair
    # Behaviour towards someone the agent is told is Indian (RF-26): both groups fixed, only
    # person 2's flips.
    - base: *base
      factor: p2_ethnicity
      ethnicity: {p1: chinese, p2: chinese}
      to: indian
    - base:
        <<: *base
        ethnicity_pair: different
      factor: p2_ethnicity
      ethnicity: {p1: chinese, p2: malay}
      to: indian
    # Person 1 told that it finds person 2 attractive, against unremarkable.
    - base: *base
      factor: attractiveness_0_sees_1

# RF-10's gate, unchanged, so the two models are judged alike (its reason speaks of RF-10's
# 192 sessions; here the design is the 64 independent ones).
resolution_gate:
  plan_only_resolved_min: 0.50
  reason: >-
    Step 1 asks whether LLM agents can resolve the conflict on their own plans, so the gate is the
    plan_only rate (ORCA does not steer the pair apart), pooled over the design's 192 sessions of
    32 cells x 2 geometries x 3 conditions (exact repeats and counterfactual pairs left out, so
    each cell counts once per geometry and condition). 0.50 means the plans resolve the meeting
    more often than not; it is a judgement, not a sourced number. Head-on walkers in life almost
    never collide, so 0.50 is lenient against people, and strict against plain ORCA here, which
    passes within the near-miss distance and never counts as resolved (RF-9: 0 of 72). RF-9's
    pilot resolved 0.24 before resolve_v6's fixes, so failing the gate is a possible Step 1 result.

protocol:
  max_decision_points: 3            # D5
  min_gap_s: 1.0                    # D5
  no_conflict_end_s: 1.0            # [placeholder] the encounter ends after this long with no conflict predicted
  max_prompted: 4                   # D11, D12: the cap on prompted people per encounter (a cost limit)
  speech_words_per_second: 2.5      # [placeholder] how fast a message is said
  execution: as_prompted            # issue #64: a turn holds its angle; after its steps an agent keeps its line
  no_conflict_waits_for_plans: true # issue #65: no_conflict does not end the encounter while a plan runs

templates:
  core: resolve_v6                  # RF-10's (the user's choice for issue #100): only the model changes
  debrief: resolve_debrief_v1
  factors: resolve_factors_v2       # the ethnicity lines (issue #92)
  pairwise: resolve_pairwise_v1

llm_view: configs/resolution/llm_view_v1.yaml
factor_values: configs/resolution/factors_v1.yaml

llm:
  client: mock
  mock_policy: resolution_rehearsal_v1
  model: deepseek-v4-pro  # issue #100: the stronger model, in place of deepseek-flash
  temperature: 1.0        # the experiment's one sampling setting, unchanged (llm-backend.md, section 2)
  max_tokens: 600         # issue #100, the user's decision: v4-pro pretty-prints its JSON; 300 cut 1 of 12 replies off
  thinking: disabled
  transport_retries: 2

budget:
  cap_usd: 0.28           # #100's USD 0.30 (CLAUDE.md) less the USD 0.0116 the first run spent
  ledger: spend_ledger.jsonl
  over_cap: stop_at_cap

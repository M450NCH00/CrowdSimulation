# Singapore's ethnic groups at their resident shares (issue #92, RF-26; docs/ethnicity.md).
# Read by negsim.resolution.ethnicity for a design that varies ethnicity_pair.
# Updating the shares later is a new file (ethnicity_sg_<year>.yaml), never an edit of this one.
schema_version: 1
groups:              # the order is the order of the template's lines and of every table
  chinese: 73.9      # percent of the resident population
  malay: 13.5
  indian: 9.0
  others: 3.6
source:
  publisher: Singapore Department of Statistics
  title: Population Trends, 2026
  published: "2026-09-25"
  url: https://www.singstat.gov.sg/publication-resources/population-trends-2026
  read: "2026-10-24"
  cached: refs/rf26_singstat_population_trends_2026.txt
  sentence: >-
    The ethnic composition of the resident population remained broadly stable over the decade,
    comprising 73.9% Chinese, 13.5% Malays, 9.0% Indians, and 3.6% Others as at end-June 2026.
limits:
  - >-
    The shares are of the resident population only: 4.23 million of a total population of 6.21

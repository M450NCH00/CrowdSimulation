# What the two core and situational factors that act outside the prompt do (issue #60, RF-5;
# docs/resolution.md, D1 and D12), version 1. A new file, never an edit: a change is
# factors_v2.yaml. negsim/resolution/factors.py reads it (FactorValues); a resolution config
# names it under factor_values, and uses this file when it names none.
#
# Every other core and situational factor exists only in the prompt (factors.py says why).
#
# Tags as in llm_view_v1.yaml: [cited], [derived], [placeholder], [design]. Every value here is a
# placeholder; docs/parameters.md, section 8.7, says how each was chosen and what would replace
# it. Do not report a result that depends on one as if it rested on data.
schema_version: 1

load:
  large_suitcase:
    width_added_m: 0.2       # m      how much wider a person pulling a large suitcase is, for the whole run (D1: bodies never change size during a run). A disc 0.2 m wider stands in for a body and a suitcase: it overstates the width beside the person and leaves out the length behind them   [placeholder]

surroundings:
  quiet:
    hearing_range_m: 8.9     # m      a raised voice (64 dB at 1 m) against a 45 dB background, the level Pearsons et al. 1977 call typical of homes, 6 dB less per doubling of distance: 10^((64 - 45) / 20) = 8.9 m. The inputs are cited; that a quiet place is as quiet as a home is an assumption   [placeholder]
  busy:
    hearing_range_m: 3.2     # m      the same voice against a department store's 54 dB: llm_view_v1.yaml's hearing_range_m, which assumes a public indoor place. That a busy place is as loud as a department store, and no louder, is an assumption   [placeholder]

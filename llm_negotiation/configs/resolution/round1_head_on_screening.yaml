# Issue #65 (RF-10): round 1, head-on in a corridor, Phase A screening of 16 factors.
#
#   python run_experiment.py configs/resolution/round1_head_on_screening.yaml --plan
#   python run_experiment.py configs/resolution/round1_head_on_screening.yaml --out runs_mock/rf10   # mock rehearsal
#
# PAID RUN: NOT YET APPROVED. CLAUDE.md records approval of paid runs for issue #64 only (pending
# item 1). This config names the mock client; a paid run (--client deepseek --confirm) waits until
# CLAUDE.md records the approval and cap for #65. budget.cap_usd below is the cap proposed to the
# user (USD 0.35: about 276 sessions x USD 0.00088 off-peak, RF-9's measured cost, with headroom
# so that stop_at_cap does not cut the fraction short), and must match what CLAUDE.md records.
#
# The design (the issue's, decided on the user's delegation of 2026-10-24, WORK_LOG-65.md):
# a 2^(16-11) resolution IV fraction (32 cells; Chen & Cheng 2006, docs/screening-designs.md), on
# round 1's two head-on geometries (D14; RF-9: aligned and 20 cm apart resolved alike, keep 2),
# all three conditions; the exact-repeat set (8 cells, 3 times each; RF-9's recommendation); and
# four counterfactual pairs. That is 32 x 2 x 3 = 192 sessions, 48 exact repeats and
# 4 x 2 x 2 x 3 = 48 sessions of the pairs: 288 in all (--plan gives the count).
#
# The 16 factors: the issue's 13 (age, gender, urgency, mobility aid, load, distraction,
# assertiveness, residence, perceived attractiveness in each direction, familiarity, memory note,
# ethnicity pair), RF-5's two situational factors (surroundings, time of day), and mapping, which
# keeps person 1's slot counterbalanced (docs/screening-designs.md, section 3). The supervisor
# asked for as many factors as possible: the 32-cell fraction holds 16 at resolution IV, so every
# slot is used. Each factor's main effect is clear of two-factor interactions, which are aliased
# with each other.
#
# Real ethnicity is drawn balanced (design.ethnicity_draw: balanced, the user's decision of
# 2026-10-24, issue #92): every group equally often; ethnicity_weight restores the resident shares
# for population-level figures. Perceived attractiveness and real ethnicity are on: both ethics
# sign-offs are recorded in CLAUDE.md (2026-10-24). No rule may read either.
#
# RF-9's three fixes (WORK_LOG-64.md, decided on the user's delegation): core template resolve_v6
# (an until at a distance or written as an object; a drift is not a crossing) and
# protocol.no_conflict_waits_for_plans. RF-9's execution: as_prompted. Reply cap 300 tokens.
#
# This config names no scenario: the geometries' cases name wide_corridor_head_on (D16).
schema_version: 1
layer: resolution
experiment_name: rf10_round1_head_on
description: >-
  RF-10, round 1 (head-on), Phase A: a 32-cell resolution IV fraction of 16 factors on two head-on
  geometries, all three conditions, the exact-repeat set (8 cells x 3), and four counterfactual
  pairs (ethnicity pair; person 2's group twice; attractiveness as person 1 sees person 2);
  resolve_v6, as_prompted, no_conflict waits for plans; the resolution gate fixed at 0.50.

conditions: [independent, non_verbal, talk]

design:
  kind: fractional
  cells: 32
  seed: 65
  base_age: 25
  age_difference: 45
  ethnicity_draw: balanced
  geometries:
    - head_on_de176842@2   # wide_corridor_head_on, walking lines aligned (0 cm apart)
    - head_on_02dfbadb@2   # the same, walking lines 20 cm apart
  exact_repeats:
    cells: 8
    times: 3
  factors:
    age_pair: [same, p1_older]
    gender_pair: [p1_female, p1_male]
    urgency: [neither, p1]
    mobility_aid: [neither, p1]
    load: [neither, p1]
    distraction: [neither, p1]
    assertiveness: [neither, p1]
    residence: [neither, p1]
    memory_note: [neither, p1]
    attractiveness_0_sees_1: [unremarkable, attractive]   # how person 1 sees person 2
    attractiveness_1_sees_0: [unremarkable, attractive]   # how person 2 sees person 1
    familiarity: [strangers, acquaintances]
    ethnicity_pair: [same, different]
    surroundings: [quiet, busy]
    time_of_day: [daytime, late_night]
    mapping: [p1_lower, p1_higher]
    demographics_visible: [true]
    ethnicity_visible: [true]
    attractiveness_visible: [true]
  counterfactual_pairs:
    # The same session but person 2's group differs (same to different), person 1's kept.
    - base: &base
        age_pair: same
        gender_pair: p1_female
        urgency: neither
        mobility_aid: neither
        load: neither
        distraction: neither
        assertiveness: neither
        residence: neither
        memory_note: neither
        attractiveness_0_sees_1: unremarkable
        attractiveness_1_sees_0: unremarkable
        familiarity: strangers
        ethnicity_pair: same
        surroundings: quiet
        time_of_day: daytime
        mapping: p1_lower
      factor: ethnicity_pair
    # Behaviour towards someone the agent is told is Indian (RF-26): both groups fixed, only
    # person 2's flips.
    - base: *base
      factor: p2_ethnicity
      ethnicity: {p1: chinese, p2: chinese}
      to: indian
    - base:
        <<: *base
        ethnicity_pair: different
      factor: p2_ethnicity
      ethnicity: {p1: chinese, p2: malay}
      to: indian
    # Person 1 told that it finds person 2 attractive, against unremarkable.
    - base: *base
      factor: attractiveness_0_sees_1

# Fixed before the run (task 3). Decided on the user's delegation of 2026-10-24 (WORK_LOG-65.md).
resolution_gate:
  plan_only_resolved_min: 0.50
  reason: >-
    Step 1 asks whether LLM agents can resolve the conflict on their own plans, so the gate is the
    plan_only rate (ORCA does not steer the pair apart), pooled over the design's 192 sessions of
    32 cells x 2 geometries x 3 conditions (exact repeats and counterfactual pairs left out, so
    each cell counts once per geometry and condition). 0.50 means the plans resolve the meeting
    more often than not; it is a judgement, not a sourced number. Head-on walkers in life almost
    never collide, so 0.50 is lenient against people, and strict against plain ORCA here, which
    passes within the near-miss distance and never counts as resolved (RF-9: 0 of 72). RF-9's
    pilot resolved 0.24 before resolve_v6's fixes, so failing the gate is a possible Step 1 result.

protocol:
  max_decision_points: 3            # D5
  min_gap_s: 1.0                    # D5
  no_conflict_end_s: 1.0            # [placeholder] the encounter ends after this long with no conflict predicted
  max_prompted: 4                   # D11, D12: the cap on prompted people per encounter (a cost limit)
  speech_words_per_second: 2.5      # [placeholder] how fast a message is said
  execution: as_prompted            # issue #64: a turn holds its angle; after its steps an agent keeps its line
  no_conflict_waits_for_plans: true # issue #65: no_conflict does not end the encounter while a plan runs

templates:
  core: resolve_v6                  # issue #65: RF-9's fixes on resolve_v5
  debrief: resolve_debrief_v1
  factors: resolve_factors_v2       # the ethnicity lines (issue #92)
  pairwise: resolve_pairwise_v1

llm_view: configs/resolution/llm_view_v1.yaml
factor_values: configs/resolution/factors_v1.yaml

llm:
  client: mock
  mock_policy: resolution_rehearsal_v1
  model: deepseek-flash   # what the preview prices; the mock answers
  temperature: 1.0        # the experiment's one sampling setting, unchanged (llm-backend.md, section 2)
  max_tokens: 300         # RF-9's recommended reply cap (largest reply 214 tokens)
  thinking: disabled
  transport_retries: 2

budget:
  cap_usd: 0.35           # PROPOSED, NOT YET APPROVED: must match the cap CLAUDE.md records for #65
  ledger: spend_ledger.jsonl
  over_cap: stop_at_cap

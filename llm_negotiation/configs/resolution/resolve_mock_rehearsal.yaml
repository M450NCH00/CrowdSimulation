# Issue #58 (RF-3), task 11: the Step 1 encounter protocol rehearsed end to end on the mock client.
# No network and no cost; the output goes under runs_mock/, which git does not track.
#
#   python run_experiment.py configs/resolution/resolve_mock_rehearsal.yaml --plan
#   python run_experiment.py configs/resolution/resolve_mock_rehearsal.yaml
#
# One case of each of rounds 1 to 3 (head-on, narrow passage, overtaking), plus one crowd case
# in which four people are prompted, to exercise encounters of more than two people and the cap
# on prompted people; all three conditions. The mock does not imitate a model
# (negsim/resolution/mock.py): each session, agent and decision point takes one scripted path,
# so that every path of the reply, the parser and the debrief is taken somewhere. Nothing here
# is a finding about a model.
#
# The crowd case's run has 100 people, about 20 s per run, and a session runs it four times
# (the live encounter, plain ORCA, both replays): its six sessions take most of the time.
#
# Running it again resumes it (sessions already done are read back, never run again).
schema_version: 1
layer: resolution
experiment_name: resolve_mock_rehearsal
description: >-
  Mock rehearsal of the Step 1 encounter protocol: head-on, narrow passage, overtaking and a
  crowd case with four prompted; independent, non-verbal and talk.

cases:
  store: cases
  ids:
    - head_on_02dfbadb@2      # round 1: wide_corridor_head_on, walking lines 20 cm apart
    - passage_02fac1e4@1      # round 2: passage_meeting, they meet in the middle
    - overtaking_23c5d31e@2   # round 3: overtaking, 30 cm aside (the one ahead cannot see behind)
    - flow_ba3c7962@2         # a crowd: bidirectional_flow, 100 people; four prompted at the first decision point

scenarios:
  flow_ba3c7962: passing_crowd   # the others would be found by case type anyway; named here for the reader

conditions: [independent, non_verbal, talk]

design:
  seed: 58
  base_age: 25
  age_difference: 45
  repeats: 1
  factors:
    age_pair: [p1_older]
    gender_pair: [p1_female]
    task: [p1_urgent]
    demographics_visible: [true]
    mapping: [p1_lower, p1_higher]

protocol:
  max_decision_points: 3         # D5
  min_gap_s: 1.0                 # D5
  no_conflict_end_s: 1.0         # [placeholder] the encounter ends after this long with no conflict predicted
  max_prompted: 4                # D11, D12: the cap on prompted people per encounter (a cost limit)
  speech_words_per_second: 2.5   # [placeholder] how fast a message is said

templates:
  core: resolve_v2
  debrief: resolve_debrief_v1

llm_view: configs/resolution/llm_view_v1.yaml

llm:
  client: mock
  mock_policy: resolution_rehearsal_v1
  model: deepseek-flash   # what the preview prices; the mock answers
  temperature: 1.0
  max_tokens: 400         # [placeholder] the reply cap, as in #30's config
  thinking: disabled
  transport_retries: 2

budget:
  cap_usd: 0.05
  ledger: spend_ledger.jsonl

# Head-on hallway — this project's canonical case. It is NOT a GameChat scenario.
#
# The sizes and speeds here are at the scale of a walking person, not of GameChat's
# 0.1 m robots, because this scenario is used with human personas that are told their own
# speed and size. THESE NUMBERS ARE PLACEHOLDERS [unverified]: they are round, plausible
# values chosen so that the platform could be built and tested, not values taken from a
# source. Replace them with sourced ones before running an experiment that will be
# reported (WORK_LOG-24.md, open question Q3).
schema_version: 1
type: hallway
description: >
  Two people face each other across a hallway too narrow for them to pass, with a
  waiting area at each end.

dt: 0.1                    # s      design choice; finer than GameChat's 0.2 s because the agents are faster
max_time: 40.0             # s      design choice
goal_tolerance: 0.2        # m      design choice

geometry:
  length: 4.0              # m      hallway length                                       [unverified placeholder]
  width: 0.8               # m      hallway width; less than two body widths             [unverified placeholder]
  room_width: 3.0          # m      width of the waiting areas (sets the wall blocks)    [unverified placeholder]
  start_setback: 2.5       # m      how far from the hallway mouth each agent starts
  merge_distance: 0.6      # m      how far before the mouth a path joins the centre line
  lateral_offset: 0.6      # m      how far to its own right each agent starts and finishes

agent_defaults:
  radius: 0.25             # m      body radius, i.e. a 0.5 m body width                 [unverified placeholder]
  max_speed: 1.3           # m/s    maximum walking speed                                [unverified placeholder]
  max_turn_rate: 2.0       # rad/s                                                      [unverified placeholder]
agents: [{}, {}]           # per-agent overrides of agent_defaults, by agent index
start_offsets: [0.0, 0.0]  # m      how far each agent's start is moved back along its first leg
swap_sides: false          # false: agent 0 starts in the west and agent 1 in the east

conflict:
  predictor: desired_path  # heading rays are collinear when two agents meet head-on, so the zone comes from the paths
  safety_margin: 0.1       # m      design choice
  zone_half_length: auto

controller:
  backend: path_tracking
  lookahead: 0.6           # m      design choice

observation:
  max_range: null          # no limit: the two can see each other down the hallway
  walls_block_sight: false

deadlock:
  window_s: 3.0            # s      design choice (see doorway.yaml)
  speed_eps: 0.01          # m/s

# GameChat's three agent types and their task strings.
#
# Source: Mahadevan, Zhang, Chandra, arXiv:2503.12333v1, Sec IV-C and Table I:
# "There are three types of agents. In decreasing order of priority they are: hospital
# agents, airport agents, and grocery agents." "Each agent was randomly given one of the
# task strings from their type's set of possible strings" (Sec V-A).
#
# The strings are the paper's. The repository's hospital list is different (six strings,
# LLM_utils.py:9-16, commit c49c35a); see docs/gamechat-notes.md.
#
# A task string replaces TASK in "You are taking someone to TASK." (template
# gamechat_task) or completes "You are on your way to ..." (template persona).
schema_version: 1
source: "arXiv:2503.12333v1, Table I"

# Highest priority first. This order is the ground truth that conditions C0 and C1 are
# scored against. Persona conditions are never scored against it.
priority_order: [hospital, airport, grocery]

task_strings:
  hospital:
    - the hospital
    - the emergency room
    - the operating room
    - the ER
    - get surgery
  airport:
    - the airport
    - catch a flight
    - board a plane
    - reach the airport
    - go to the airport
  grocery:
    - the grocery store
    - the supermarket
    - the store
    - go grocery shopping
    - buy groceries

# The SECONDARY baseline of issue #28: plain ORCA with nothing to break exact symmetry.
# Reported beside the primary baseline, orca_perturbed_v1, because unperturbed ORCA
# deadlocks in exactly symmetric meetings. docs/baseline.md gives the reason for every value.
#
# FROZEN. configs/baselines/MANIFEST.json holds this file's SHA-256 and the loader refuses
# it if it has been edited. Any change is a new file, orca_unperturbed_v2.yaml.
schema_version: 1
name: orca_unperturbed_v1
version: 1
role: secondary
description: >
  Plain ORCA with no perturbation: deterministic, and deadlocked by an exactly symmetric
  meeting. No directives.
sign_off: >
  Values set by the user in issue #28. Supervisor sign-off: pending unless WORK_LOG-28.md
  records otherwise.

perturbation:
  magnitude_mps: 0.0         # m/s  none   [design]

orca:
  tie_break: brake           # an exact tie between the two passing sides is not broken (DD26)   [design]

agent_types:                 # applied to every agent type of a scenario
  max_neighbours: 40         # how many neighbours an agent attends to   [placeholder]
  sensing_radius: 12.5       # m    R   [placeholder]

# Issue #122 (RF-37): round 1's rules and plain ORCA in head-on meetings matched to the studies of the
# human targets (configs/human_targets/head_on_v1.yaml). The same rules, arms, base seed, baseline and
# realistic people as RF-33's round 1 (configs/rule_set_evaluation/rf18_round1_realistic.yaml); the
# scenarios are new, and the trajectory is logged on every step, which the pair measures need
# (negsim/human_targets/measures.py). No model is called, so it costs nothing.
#
#   python run_experiment.py configs/rule_set_evaluation/rf37_head_on.yaml --plan
#   python run_experiment.py configs/rule_set_evaluation/rf37_head_on.yaml
#
# Its "helps" verdicts are computed as for any rule-set evaluation and are not this issue's question;
# the human targets are judged by python -m negsim.human_targets.report (docs/human-targets.md).
schema_version: 1
layer: rule_set_evaluation
experiment_name: rf37_head_on
description: >
  Round 1's runnable staged rules alone and together, rule_db's hand-written default set as a
  reference, and plain ORCA, in head-on meetings of two people in Moussaid et al. 2009's corridor
  (1.75 m), at Moussaid's walking speed and at Huber et al. 2014's three speeds; people from a
  realistic Singapore crowd. Measured against the human targets of issue #122.

rules:                       # as rf18_round1_realistic.yaml (issue #112), unchanged
  ext_head_on_0ecc2d1a6e:    # both turn 10° left from 9.8 m until the other passes
    from: runs/rf31_round1_head_on/rule_db_staging/extracted
    version: 2
  ext_head_on_6455ca5589:    # whoever faces a person with a cane slows
    from: runs/rf31_round1_head_on_retry/rule_db_staging/extracted
    version: 2
    priority: 600            # [the user's choice, 2026-10-27] the narrower rule wins where both match; switched on as v3
    reason: >
      Both translations have priority 500 and both match a head-on in which one person has a cane, so the loader refuses
      them together (ambiguous). The user chose that the narrower rule wins where both match (the cane rule), so that
      set 2 can run; the left-turn rule applies to every other head-on.

left_out:
  - rule: ext_head_on_aacce0961b (RF-31, format 4)
    reason: refused by the loader since RF-31 (constant_roles); its roles hold for both people, so it never matched
  - rule: ext_head_on_4eb7a97c8d (RF-11)
    reason: not expressible in either format (signalling and speaking); nobody signals in ORCA

arms:                        # as rf18_round1_realistic.yaml
  - name: passed_screening
    rules: [ext_head_on_0ecc2d1a6e]
    description: Set 1, the rules that passed crowd screening (the left-turn rule).
  - name: cane_rule_alone
    rules: [ext_head_on_6455ca5589]
    description: The retried cane rule alone.
  - name: all_runnable
    rules: [ext_head_on_0ecc2d1a6e, ext_head_on_6455ca5589]
    description: Set 2, every runnable staged rule.
  - name: reference_default
    database: rule_db
    ruleset: default
    judged: false
    description: rule_db's hand-written seed rules of issue #28 (keep left head-on and three more), numbers only.

scenarios:                   # [design] all in configs/scenarios/wide_corridor_head_on.yaml, Moussaid2009's corridor
  - name: head_on                # H1, H2, H4 to H8 and the side: Moussaid2009's walking speed (1.3 m/s, the file's own)
    seeds: 30
    scenario: configs/scenarios/wide_corridor_head_on.yaml
    population: configs/populations/singapore_street_v1.yaml
    purpose: realistic
    pool: 100                    # the pair is the first two of a crowd of 100 at exact shares, a new pair on every seed
    note: Two people head-on in a 1.75 m corridor, at 1.3 m/s, drawn from a realistic crowd.
  - name: head_on_slow           # H3: Huber2014's three walking speeds (Results 1), for both walkers
    seeds: 30
    scenario: configs/scenarios/wide_corridor_head_on.yaml
    scenario_overrides: {agent_types: {pedestrian: {preferred_speed: 1.15}}}
    population: configs/populations/singapore_street_v1.yaml
    purpose: realistic
    pool: 100
    note: As head_on, both at Huber2014's slow speed, 1.15 m/s.
  - name: head_on_normal
    seeds: 30
    scenario: configs/scenarios/wide_corridor_head_on.yaml
    scenario_overrides: {agent_types: {pedestrian: {preferred_speed: 1.42}}}
    population: configs/populations/singapore_street_v1.yaml
    purpose: realistic
    pool: 100
    note: As head_on, both at Huber2014's normal speed, 1.42 m/s.
  - name: head_on_fast
    seeds: 30
    scenario: configs/scenarios/wide_corridor_head_on.yaml
    scenario_overrides: {agent_types: {pedestrian: {preferred_speed: 1.78}}}
    population: configs/populations/singapore_street_v1.yaml
    purpose: realistic
    pool: 100
    note: As head_on, both at Huber2014's fast speed, 1.78 m/s (below the scenario's max_speed of 2.0).

baseline: orca_perturbed_v1  # the primary baseline, as round 1
seed: 30900                  # round 1's base seed
seeds: 30
alpha: 0.05
verdict_rule: 2

logging:
  trajectory_stride: 1       # the pair measures need every step (0.1 s)

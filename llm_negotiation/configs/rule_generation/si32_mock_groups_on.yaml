# Issue #32: rule generation rehearsed end to end on the mock client, with prompt version 2 and
# the fictional group switched ON. No network and no cost; the output goes under runs_mock/,
# which git does not track. Nothing it produces is a finding about a model.
#
#   python run_experiment.py configs/rule_generation/si32_mock_groups_on.yaml
#
# The group is on here only because this is a mock rehearsal of it: every other config leaves it
# off, and a paid run with it on is refused until the supervisor's ethics sign-off is recorded in
# CLAUDE.md (docs/fictional-groups.md, section 6). Its pair, si32_mock_no_groups.yaml, is the
# same experiment with the group not in the design at all.
#
# The mock (rulegen_paths_v2) takes every path of issue #30 and issue #32's three: a rule that
# reads a person's group (protected_attribute), a valid rule for a meeting inside a passage, and
# one in which both back out (inconsistent). The cases: issue #30's two pilot cases at their
# re-stepped version 2 (si3_v2), and four of the in-passage cases (si32_passage_v1), both
# scenarios, at rest and walking. With ids and no set, each case is read at its latest version.
# The group's three factors at every level (group pair, label rotation, visibility) crossed with
# a few persona levels: 48 cells per case and condition.
schema_version: 1
layer: rule_generation
experiment_name: si32_mock_groups_on
description: >-
  Mock rehearsal of rule generation with prompt version 2 and the fictional group on: both
  conditions, every path of rulegen_paths_v2, two re-stepped cases and four in-passage cases,
  replay and screening of every rule written.

cases:
  store: cases
  ids:
    - head_on_de176842      # wide_corridor_head_on, aligned: version 2 (si3_v2)
    - overtaking_2d08db11   # overtaking, in line: version 2 (si3_v2)
    - passage_10e542c2      # passage_meet_middle_v1, agent 0 2.7 m in, agent 1 0.7 m; at rest
    - passage_067961e3      # passage_meet_middle_v1, 1.7 m each; walking
    - passage_f89f5745      # passage_meet_with_speeds_v1, 2.0 and 1.4 m; at rest
    - passage_25f09e61      # passage_meet_with_speeds_v1, 1.7 m each; walking

conditions: [negotiated, stated]

design:
  seed: 32
  base_age: 25
  age_difference: 45
  factors:
    age_pair: [p1_older]
    gender_pair: [p1_female]
    task: [none, p1_urgent]
    demographics_visible: [true]
    mapping: [p1_lower]
    order: [lower_first, higher_first]
  ethnicity:
    enabled: true           # explicit, as the issue requires; the default labels and framing word

negotiation:
  template: rulegen_negotiate_v2
  max_messages_per_agent: 4

statement:
  template: rulegen_state_v2
  repeats: 1

llm:
  client: mock
  mock_policy: rulegen_paths_v2
  model: deepseek-flash
  temperature: 1.0
  max_tokens: 600
  thinking: disabled
  transport_retries: 2

budget:
  cap_usd: 0.05
  ledger: spend_ledger.jsonl

replay:
  enabled: true

screening:
  enabled: true
  scenario: configs/scenarios/bidirectional_flow.yaml
  baseline: orca_perturbed_v1
  seed: 30900
  repeats: 1
  scenario_overrides: {geometry: {agents_per_direction: 10, length: 20.0}, max_time: 60.0}   # a rehearsal: a small crowd

# Issue #144 (RF-53), stage 1: RF-43's static probes of the left-and-right conversion, frozen.
#
# Source: literature/frames-of-reference/probes.md (issue #132, RF-43, task 4), which drafted the 20
# probes and their expected answers but sent none. This file is what is sent, word for word: each
# probe's `prompt` is the whole user message (there is no system message). Like a prompt template it
# is frozen: a wording change means frames_probes_v2, never an edit (CLAUDE.md, track #55's
# constraints). The runner checks this file's SHA-256 against the config's `probes_sha256`.
#
# How the wording differs from probes.md, all the assistant's choices (WORK_LOG-144.md), none changing
# what a probe asks:
# - The other person is named "Person 2" in every probe, so that group C's note is resolve_v9's own
#   sentence word for word ("(Person 2 is facing you: their left is your right, and their right is
#   your left.)", heard_seen_facing), and A and C differ only by that note. A message is written as
#   resolve_v9 writes one heard: Person 2 says: "...".
# - The answer instruction comes last, after the question, and allows a short phrase ("your right",
#   group D) as well as a word or a lane number.
# - Each question names its options ("left or right?", "the north wall or the south wall?"), as
#   probe 1 does in probes.md. Probes 13 and 15 name only left and right, so that "cannot tell" is
#   the model's own answer, not an offered option.
#
# Scoring (negsim.probe.score): the first non-empty line of the reply is read for one label of the
# probe's `kind`. `correct` lists the labels scored correct and `wrong` those scored wrong; any other
# reading is "unclear" (reported apart, and in the hand check).
schema_version: 1
name: frames_probes_v1
source: literature/frames-of-reference/probes.md
answer_line: >-
  Answer on the first line with your answer only (a word, a short phrase or a lane number), then
  give one sentence saying why on the next line.

groups:
  A: You hear a side in the speaker's own frame (RF-40's E2)
  B: You hear a side in your own frame (RF-40's E2, the listener's frame)
  C: The same messages with resolve_v9's facing note (RF-40's E3)
  D: You are the speaker (RF-40's E1)
  E: An absolute frame with no heading (does the model invent a heading?)
  F: An absolute frame with the heading told
  G: A grid (variants D and E of action-space.md)

# kind: side (left / right / cannot_tell), their_side (left / right of the other person, as said to
# them; "my ..." is unclear), wall (north / south), named_side (window / shop), lane (1 to 5).
probes:
  - id: p01
    group: A
    kind: side
    correct: [left]
    wrong: [right]
    prompt: >-
      You are walking along a straight corridor 1.75 m wide. Another person, Person 2, is walking
      towards you, facing you, 6 m ahead, in the middle of the corridor, as you are.
      Person 2 says: "I'll keep to my left." Which way do you move, left or right?
  - id: p02

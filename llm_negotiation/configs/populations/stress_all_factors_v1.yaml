# Every factor at half (issue #112, RF-33; docs/population-profiles.md): RF-18's crowd of round 1,
# named for what it is. No real crowd looks like this: it is for testing whether a rule works where
# it applies, never a rule's verdict of record on its own (the user's decision of 2026-10-27).
# Frozen: a change is a new file, never an edit of this one.
#
# The people are given exactly as RF-18 gave them (negsim.rulegen.replay.mixed_population: each
# factor's levels cycle, each more slowly than the one before it), so a scenario with this profile
# runs the same people as RF-18's on the same seeds.
schema_version: 1
name: stress_all_factors_v1
purpose: stress
generator: cycle

ages: [25, 70]
genders: [female, male]
factors:
  mobility_aid: [none, cane]
  load: [none, large_suitcase]
  distraction: [none, phone]
  assertiveness: [gives_way, holds_ground]

limits:
  - >-
    Half the crowd is 70, carries a cane, pulls a large suitcase, looks at a phone and holds its
    ground. A rule about any of these applies far more often than it would in a real crowd.

# Personas for the negotiation experiments.
#
# Fields: persona_id, age (whole years), gender (female | male | nonbinary),
# backstory (optional, empty by default) and task. The task completes the sentence
# "You are on your way to ...".
#
# No personal names, anywhere: a name carries gender and ethnicity cues that would be
# confounded with age and gender. The loader rejects name-like fields.
#
# This is a 2 x 2 grid (age 25 or 70, female or male) with one task, so that age and
# gender can each be varied with the other held fixed. An experiment can also change any
# field of a persona for one run, e.g. {persona: f25, age: 70} or
# {persona: m70, task: "the hospital emergency room"}; see configs/experiments/.
#
# The two ages and the task are placeholders chosen to exercise the platform. They are
# not a claim about which ages or errands the study should use.
schema_version: 1
personas:
  - persona_id: f25
    age: 25
    gender: female
    backstory: ""
    task: the supermarket to buy groceries

  - persona_id: m25
    age: 25
    gender: male
    backstory: ""
    task: the supermarket to buy groceries

  - persona_id: f70
    age: 70
    gender: female
    backstory: ""
    task: the supermarket to buy groceries

  - persona_id: m70
    age: 70
    gender: male
    backstory: ""
    task: the supermarket to buy groceries

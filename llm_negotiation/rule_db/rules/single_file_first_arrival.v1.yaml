# A seed rule of issue #28 (SI-2). It is here to exercise the rule machinery. It is not a
# claim about how people behave; checking that is the validation sub-issue's (SI-6).
schema_version: 1
rule_id: single_file_first_arrival
version: 1
status: test_seed
description: >
  At a stretch only one person can use at a time, whoever would get there first goes
  first. If the two would get there at about the same time, the rule does not say, and the
  arbiter's own rule decides.
provenance:
  source_type: hand_written
  source_ref: "issue #28 (SI-2), Part 6, seed rules"
  created_at: 2026-10-14
  author: "the user (specification in issue #28); written out by Claude Code (claude-opus-5-5)"
  notes: >
    Test fixture only. Not a claim about human behaviour. Times to the segment within
    0.5 s of each other are a tie (no_match): the arbiter of issue #24 then decides as it
    always has. The rule keeps issue #26's expiry, out_of_range, instead of the default:
    its directive only matters while the arbiter holds the pair, and 'passed' is measured
    between the two bodies, which can separate while both are still queueing for the
    segment (docs/rule-matching.md, "Expiry").
  validation_evidence: []
encounter: single_file_segment
when:
  all: []
roles:
  by: {field: agent.time_to_segment_s, order: ascending, assign: [leader, follower], tie: no_match, tie_within: 0.5, unit: s}
directive:
  leader: {passage_order: leader}
  follower: {passage_order: follower}
priority: 10
expiry: out_of_range

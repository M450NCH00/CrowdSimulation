# A seed rule of issue #28 (SI-2). It is here to exercise the rule machinery. It is not a
# claim about how people behave; checking that is the validation sub-issue's (SI-6).
schema_version: 1
rule_id: keep_left_head_on
version: 1
status: test_seed
description: >
  Two people meeting head-on in a passage wide enough for the two of them each keep to their own
  left, and pass right shoulder to right shoulder.
provenance:
  source_type: hand_written
  source_ref: "issue #28 (SI-2), Part 6, seed rules"
  created_at: 2026-10-14
  author: "the user (specification in issue #28); written out by Claude Code (claude-opus-5-5)"
  notes: >
    Test fixture only. Not a claim about human behaviour. The width threshold, 1.0 m, is
    two effective shoulder widths of 49.8 cm (Yamamoto et al. 2019, Sec 4.3;
    refs/b3_yamamoto_bodyrotation.txt:649-652), rounded: the narrowest passage in which
    two such bodies fit side by side. In open ground the width is as far as the agents
    can see, so the rule applies there too.
  validation_evidence: []
encounter: head_on
when:
  all:
    - {field: pair.min_corridor_width_m, op: ">=", value: 1.0, unit: m}
roles: symmetric
directive:
  both: {side_preference: left}
priority: 10

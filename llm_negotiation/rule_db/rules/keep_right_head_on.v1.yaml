# A seed rule of issue #28 (SI-2). It is here to exercise the rule machinery. It is not a
# claim about how people behave; checking that is the validation sub-issue's (SI-6).
#
# The mirror image of keep_left_head_on, at the same priority. The two cannot be switched
# on together (same encounter, same priority, opposite sides: the database reports them as
# a clash), so this one is not in the default rule set. An experiment switches it on in
# place of keep_left_head_on to compare the two (docs/rule-format.md, "Rule sets").
schema_version: 1
rule_id: keep_right_head_on
version: 1
status: test_seed
description: >
  Two people meeting head-on in a passage wide enough for the two of them each keep to their own
  right, and pass left shoulder to left shoulder.
provenance:
  source_type: hand_written
  source_ref: "issue #28 (SI-2), Part 6, seed rules"
  created_at: 2026-10-14
  author: "the user (specification in issue #28); written out by Claude Code (claude-opus-5-5)"
  notes: >
    Test fixture only. Not a claim about human behaviour. The mirror image of
    keep_left_head_on version 1, with the same 1.0 m width threshold, kept out of the
    default rule set to show that rules are data and to allow a direct comparison.
  validation_evidence: []
encounter: head_on
when:
  all:
    - {field: pair.min_corridor_width_m, op: ">=", value: 1.0, unit: m}
roles: symmetric
directive:
  both: {side_preference: right}
priority: 10

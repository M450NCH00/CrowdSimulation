# The rule set an experiment gets with `ruleset: default` (issue #28). Frozen in
# MANIFEST.json like every rule: a different set is a new file with a new name.
#
# keep_right_head_on is left out on purpose: it is the mirror image of keep_left_head_on at
# the same priority, so the two cannot be switched on together. An experiment that wants it
# writes `disable: [keep_left_head_on]` and `enable: {keep_right_head_on: 1}`
# (docs/rule-format.md, "Rule sets").
name: default
description: >
  The seed rules of issue #28 that are on unless an experiment says otherwise. Test
  fixtures: they exercise the machinery and make no claim about how people behave.
rules:
  keep_left_head_on: 1
  overtaker_keeps_clear: 1
  single_file_first_arrival: 1
  younger_yields_head_on: 1

# A TEST FIXTURE, not a rule of the database (issue #28, Part 6: "a rule using a gender
# condition, to test that field, kept out of rule_db/"). It loads, and it reads gender.
schema_version: 1
rule_id: gender_keeps_clear_crossing
version: 1
status: test_seed
description: When either of two people crossing paths is a woman, both keep 20 cm further apart.
provenance:
  source_type: hand_written
  source_ref: "issue #28 (SI-2), Part 6, test fixtures"
  created_at: 2026-10-14
  author: "Claude Code (claude-opus-5-5)"
  notes: Test fixture only, to exercise a gender condition. Not a claim about human behaviour.
  validation_evidence: []
encounter: crossing
when:
  all:
    - {field: either.gender, op: "==", value: female}
    - {field: pair.time_to_collision_s, op: "<", value: 5.0, unit: s}
roles: symmetric
directive:
  both: {clearance_margin: 0.2}
priority: 10

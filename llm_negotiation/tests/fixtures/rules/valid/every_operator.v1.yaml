# A TEST FIXTURE: one comparison per operator and per unit, in nested all/any groups.
# Loads; tests/test_rules_format.py evaluates it on hand-built snapshots.
schema_version: 1
rule_id: every_operator
version: 1
status: candidate
provenance:
  source_type: extracted
  source_ref: "test fixture"
  created_at: "2026-10-14"
  author: "Claude Code (claude-opus-5-5)"
  notes: ""
  validation_evidence: []
encounter: any
when:
  all:
    - {field: pair.distance_m, op: "<", value: 10.0, unit: m}
    - {field: pair.time_to_collision_s, op: "<=", value: 6.0, unit: s}
    - {field: pair.closing_speed_mps, op: ">", value: 0.5, unit: m/s}
    - {field: pair.heading_difference_rad, op: ">=", value: 150, unit: deg}
    - {field: pair.age_difference_years, op: "!=", value: 0, unit: years}
    - {field: pair.encounter_class, op: "in", value: [head_on, crossing]}
    - any:
        - {field: both.age, op: ">=", value: 60, unit: years}
        - {field: either.speed_mps, op: "==", value: 1.3, unit: m/s}
        - {field: pair.min_corridor_width_m, op: "in", value: [1.75, 4.0], unit: m}
roles:
  by: {field: agent.radius_m, order: descending, assign: [larger, smaller], tie: no_match, tie_within: 0.01, unit: m}
directive:
  larger: {responsibility_share: 0.0, speed_scale: 0.9}
  smaller: {responsibility_share: 1.0, side_preference: right, clearance_margin: 0.1}
priority: 5
expiry: out_of_range

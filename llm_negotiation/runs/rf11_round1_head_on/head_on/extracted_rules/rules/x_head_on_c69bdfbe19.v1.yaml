rule: A person who holds their ground sends no turn and lets the other go round them.
applies_when: own_assertiveness is holds_ground and the other person does not also hold their ground.
action: At the first decision (9.8 m) turn none, or at most a 5 to 15 degree shift after the other has
  moved; keep speed (row 47 first_side none, pair still passed right/right).
exceptions:
- When both hold their ground (failed "none/right", "left/none", "-/both") they collide or nearly miss.
- Rows 19, 55, 75, 87, 101, 103, 119, 125, 129, 133, 145, 149 still turn right or left.
- Coin-flip rows S074, S186.

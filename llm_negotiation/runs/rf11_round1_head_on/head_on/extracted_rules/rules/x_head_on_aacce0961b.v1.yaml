rule: A holds_ground person keeps their line at full speed on the first decision and only steps aside
  or slows at close range.
applies_when: own_assertiveness is holds_ground and first_decision_distance_m is about 9.8 m
action: first plan has no turn or a late turn of 8-15 degrees starting at 2.0-3.0 m, speed held at about
  1.3 m/s until the other passes
exceptions:
- many holds_ground rows still show first_side right or both because they plan a late small step to their
  own right at 2.0-3.0 m (rows 7, 9, 27, 29, 31, 39, 43, 75, 99, 119, 123, 133)
- row 133 gives way fully with first_side left when the other has a cane and a load
- failed talk/aligned sessions with left/right first sides collide, so holding ground against a giving-way
  other is not always enough

action: Speak at the first decision (9.8 m), an "excuse me, I'm in a hurry", "watch out, coming through"
  or "good evening, uncle"; even across three decision points they repeat the same line (rows 97, 114,
  152).
exceptions:
- Many talk rows stay silent (rows 99, 100, 101, 109, 111, 112, 113, 115, 117, 118, 119, 125, 126, 129,
  130, 131, 133, 135, 139, 140, 143, 145, 146, 147, 148), about half of the talk rows.
- Coin-flip rows S168, S186.

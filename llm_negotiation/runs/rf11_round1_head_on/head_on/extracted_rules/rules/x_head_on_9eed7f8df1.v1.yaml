rule_id: x_head_on_9eed7f8df1
version: 1
status: unstable
encounter_type: head_on
category: valid
extraction_stability: 1/3
rule: A first plan that weaves both ways crosses the other's line and the pair collides or near-misses,
  the weave coming from dithering gives_way people.
applies_when: One person's first plan is both (usually a gives_way person) and the other's is right or
  left.
action: The both person turns 10 to 15 degrees right then 10 to 15 degrees left, crossing the other's
  line; the outcome is collision or near-miss even though neither stopped.
exceptions:
- Nothing in this data reverses the pattern; the failed-session counts show both/right and both/left as
  the largest collision families.

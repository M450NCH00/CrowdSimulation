rule_id: x_head_on_6455ca5589
version: 1
status: candidate
encounter_type: head_on
category: valid
extraction_stability: 3/3
rule: A gives_way person slows on the first plan when the other was described as elderly, using a cane,
  pulling a large suitcase, or looking at a phone.
applies_when: own_assertiveness is gives_way and other_mobility_aid is cane or other_load is large_suitcase
  or other_distraction is phone or other_age is 70
action: speed drops from 1.3 to 0.8-1.1 m/s from about 9.8 m or from 2.0-3.0 m and is held until other_passes
exceptions:
- holds_ground people often do not slow on the first plan even for a loaded or elderly other (rows 27,
  29, 31, 43, 75, 125)
- urgent people keep 1.3 m/s or only slow at 2.0 m (row 39)
- coin_flip rows 1-2, 9-10, 15-16, 39-40, 51-52, 55-56, 83-84, 131-132 and 149-150 are not certain
factors_used:
- own_assertiveness
- other_mobility_aid
- other_load
- other_distraction
- other_age
- own_urgency
needs_communication: false
debrief_support:
  share: 0.9
  note: Debriefs say he is elderly and distracted by his phone so I will slow and give him room (rows
    16, 30, 34, 52, 60, 62, 72, 84, 104, 112, 124), naming courtesy and common sense.
coverage: most gives_way rows with a constrained other, about 100 rows

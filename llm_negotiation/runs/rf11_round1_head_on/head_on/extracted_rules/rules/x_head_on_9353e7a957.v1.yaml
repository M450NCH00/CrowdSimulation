version: 1
status: unstable
encounter_type: head_on
category: valid
extraction_stability: 1/3
rule: The urgent, unencumbered person speeds up instead of yielding, turning only slightly at 3 m, and
  the encounter often goes to a near miss or collision.
applies_when: own_urgency is urgent and own_mobility_aid is none and own_load is none and own_assertiveness
  is holds_ground.
action: At the first decision (9.8 m) keep speed up to 1.45 to 1.6 m/s and turn only 10 to 12 degrees
  right at 3 m, then resume full speed (row 43 1.45 then 1.1 m/s turning at 3 m; row 97 1.6 then 1.8 m/s).
exceptions:
- Urgent people with a cane or a suitcase do give way and slow (rows 33, 57, 119), and some urgent rows
  still resolved together.
- Urgency rows fail slightly more (50 of 83) than others (40 of 83), the weakest of the design factors.

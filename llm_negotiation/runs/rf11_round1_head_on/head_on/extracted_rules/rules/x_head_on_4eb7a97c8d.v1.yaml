rule_id: x_head_on_4eb7a97c8d
version: 1
status: candidate
encounter_type: head_on
category: needs_communication
extraction_stability: 2/3
rule: People signal with eye contact, a nod or a wave when the other drifts toward their side or the plan
  is failing, and speak mainly to warn about a load or greet a known other.
applies_when: condition is non_verbal or talk and decision_points is 2 or 3
action: signal at the second or third decision from about 7.2 m or 4.8 m; speak a short warning or greeting
  at the first decision or when the plan fails
exceptions:
- non_verbal rows 54, 60, 76, 93 and 94 do not signal at the first decision; signalling there begins only
  later
- talk rows 100, 111-112, 121-122, 125-130, 133-136 and 139-146 do not speak at all

rule_id: x_head_on_556d93f6a9
version: 1
status: unstable
encounter_type: head_on
category: valid
extraction_stability: 1/3
rule: People default to steering to their own right when they meet someone coming the other way, turning
  a modest angle early.
applies_when: Two people approach nearly head-on and both are unconstrained (no cane, no suitcase, no
  phone, not elderly ahead); any condition.
action: At the first decision (typically 9.8 m away) start a turn of about 10 to 15 degrees to the person's
  own right, lasting until the other passes or until about 2.0 to 2.5 m, then a small 5 to 10 degree counter-turn
  to straighten up.
exceptions:
- When the other person is visibly constrained (cane, large suitcase, phone, elderly) and this person
  is gives_way, they turn to their own left 15 degrees instead (rows 76, 108, 130).
- When the other's first plan is both (a weave), the right turn is not matched and collision or near-miss
  follows (failed independent aligned both/right 6 collisions).
- Coin-flip rows (1-2, 9-10, 15-16, 39-40, 51-52, 55-56, 83-84, 131-132, 149-150) are not certain.
factors_used:
- condition
- geometry
- own_assertiveness
- own_mobility_aid
- own_load
- own_distraction
- other_mobility_aid
- other_load
- other_distraction
- other_age
- first_decision_distance_m
needs_communication: false
debrief_support:
  share: 0.55
  note: Most common_sense and habit debriefs say to give room and edge to my right; a minority who cite
    local_custom say keep left.
coverage: About 100 of 152 rows; first_side is right for about 72 rows, both for about 28, left for about
  15, none for about 7.
references:
- citation: Singapore pedestrian keep-left convention as reported by participants
  locator: participant debriefs, S042 p2, S186 p2
  kind: local_custom
  claim: People say they keep left when passing on foot, yet in practice they ease to their own right
    when facing oncoming walkers.
  check_status: unchecked
- citation: no known source
  locator: none
  kind: none
  claim: No law or study was cited for a right-hand passing rule.
  check_status: unchecked
predict:
  target: first_side
  if:
  - when:
      own_mobility_aid: cane
      own_assertiveness: gives_way
    then: left
  - when:
      own_mobility_aid: none
      own_load: none
      own_distraction: none
      own_assertiveness: gives_way
    then: right
  - when:
      own_assertiveness: holds_ground
    then: right
  - when:
      condition: independent
    then: right
  default: both

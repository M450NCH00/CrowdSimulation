rule_id: x_head_on_dd79074f91
version: 1
status: unstable
encounter_type: head_on
category: valid
extraction_stability: 1/3
rule: In a giving-way pair with one constrained or elderly person, the pair settles on passing to their
  own right.
applies_when: Both are gives_way and at least one has a cane, suitcase, phone or is elderly.
action: Both turn right 10 to 15 degrees at 9.8 m, or the constrained one turns left and the other turns
  right and they pass on their right; passing side right in most resolved cases.
exceptions:
- When one turns left and the other turns right at once, they collide (independent apart_20cm left/right
  7, non_verbal apart_20cm left/right 5, talk aligned left/right 5).
- When one plan is both and the other none or right, they collide (independent apart_20cm both/none 2).
factors_used:
- own_assertiveness
- other_age
- other_mobility_aid
- other_load
- other_distraction
- geometry
needs_communication: false
debrief_support:
  share: 0.7
  note: Debriefs often say ease to my right and let him or her pass.
coverage: About 90 resolved rows where passing_side is known; right is the majority.
references:
- citation: Everyday courtesy and keep-side custom reported by participants
  locator: participant debriefs, S030 p2, S144 p2
  kind: local_custom
  claim: Participants say the ordinary thing is to keep to a side and let the more constrained person
    through.
  check_status: unchecked
predict:
  target: passing_side
  if:
  - when:
      own_assertiveness: gives_way
      other_age:
        '>=': 70
    then: right
  - when:
      own_assertiveness: gives_way
      other_mobility_aid: cane
    then: right
  - when:
      own_assertiveness: gives_way
      other_load: large_suitcase
    then: right
  default: right

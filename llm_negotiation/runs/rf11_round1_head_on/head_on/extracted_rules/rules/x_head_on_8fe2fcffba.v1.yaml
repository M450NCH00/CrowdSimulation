rule_id: x_head_on_8fe2fcffba
version: 1
status: unstable
encounter_type: head_on
category: valid
extraction_stability: 1/3
rule: A gives_way person turns to their own right in their first plan as a small step aside, mostly slowing
  at the same time.
applies_when: own_assertiveness is gives_way and first_decision_distance_m is about 9.8 m
action: turn own right 8-15 degrees starting now at about 9.8 m, with speed down to 1.0-1.2 m/s until
  other_passes
exceptions:
- gives_way people facing an elderly, distracted or loaded other sometimes turn left instead (rows 39
  and 83-84 show left first plans in the full records)
- aligned layouts often produce a both plan, turning right then back (rows 6, 17-18, 20, 23-26, 33, 35-38,
  45-46, 61-68)
- failed sessions with right/right and left/right first sides still collide or near-miss, so the turn
  alone does not guarantee a clean pass
factors_used:
- own_assertiveness
- geometry
- first_decision_distance_m
- own_load
- other_mobility_aid
- other_distraction
needs_communication: false

  note: Most gives_way debriefs say common sense or habit and describe easing to the right to give room
    (rows 16, 28, 34, 44, 52, 60, 62, 72, 76, 84, 98, 104, 106, 112, 124).
coverage: gives_way people in resolved sessions, about 110 of 152 rows

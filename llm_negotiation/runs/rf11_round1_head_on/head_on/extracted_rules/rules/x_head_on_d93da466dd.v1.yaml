rule_id: x_head_on_d93da466dd
version: 1
status: unstable
encounter_type: head_on
category: valid
extraction_stability: 1/3
rule: People default to turning to their own right to make room, so the pair passes right shoulder to
  right shoulder.
applies_when: geometry is apart_20cm or aligned, and neither person holds their ground.
action: At the first decision (9.8 m in every recorded session) turn to own right by 10 to 20 degrees;
  slow to about 0.6 to 1.1 m/s by about 3 m out and hold until the other passes.
exceptions:
- When both turn right in a 20-cm-apart passage they still collide (failed "right/right" near_miss and
  collision in non_verbal apart_20cm).
- When one turns left and the other right (left/right) they collide in every condition and geometry (21
  failed sessions in total).
- Coin-flip rows S001, S010, S018, S052, S074, S082, S112, S168, S186 cannot be relied on.
factors_used:
- condition
- geometry
- own_assertiveness
- first_decision_distance_m
- first_side
- first_slowed
- final_side
needs_communication: false
debrief_support:
  share: 0.8
  note: Rows 1, 2, 7, 8, 13, 14, 21, 22, 25, 26 and similar right-turning resolved rows give common_sense
    or local_custom ("sharing a narrow path, easing to one side").
coverage: about 88 resolved rows with first_side right or both and a right passing_side; a default, not
  a universal.
references:
- citation: no known source
  locator: none
  kind: common_sense
  claim: The debriefs only say "everyday courtesy, easing to one side"; no written rule was cited.
  check_status: unchecked

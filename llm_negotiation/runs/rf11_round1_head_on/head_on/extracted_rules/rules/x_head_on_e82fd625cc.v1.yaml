rule_id: x_head_on_e82fd625cc
version: 1
status: unstable
encounter_type: head_on
category: needs_communication
extraction_stability: 1/3
rule: Signalling is used opportunistically by holders of ground and by people who know each other, accompanying
  a turn rather than replacing it.
applies_when: Condition is non_verbal or talk, and the person holds ground, or knows the other, or has
  three decision points.
action: At 9.8 m or at the second or third decision (about 7 m or 5 m) give eye contact, a nod, a held-up
  hand or a wave-on, usually alongside a right turn of 10 to 15 degrees.
exceptions:
- Some non-verbal rows do not signal (54, 60, 70, 76, 93, 94, 112, 116), mostly gives_way people.
- Signalling does not prevent collision; many failed non-verbal and talk sessions include a signal.
factors_used:
- condition
- own_assertiveness
- knows_other
- decision_points
needs_communication: true
debrief_support:
  share: 0.5
  note: Debriefs mention nod, wave on and eye contact as courtesies; about half of non-verbal and talk
    rows signal.
coverage: Independent rows are not applicable; about 35 of 76 non-verbal and talk rows signal.
references:
- citation: no known source
  locator: none
  kind: habit
  claim: Participants describe nodding, waving on or eye contact as ordinary acknowledgement, not a rule.
  check_status: unchecked
predict:
  target: signalled
  if:
  - when:
      condition: independent
    then: n/a
  - when:
      own_assertiveness: holds_ground
      condition:
      - non_verbal
      - talk
    then: 'yes'
  - when:
      knows_other: 'yes'
      condition:
      - non_verbal
      - talk
    then: 'yes'
  - when:
      decision_points: '3'
      condition:
      - non_verbal
      - talk
    then: 'yes'
  default: 'no'

# Prompt template resolve_pairwise, version 1.  FROZEN — do not edit.
# The hash of this file is pinned in MANIFEST.json and checked every time it is loaded.
# To change any wording, copy the file to resolve_pairwise_v2.yaml, change it there, freeze it,
# and record the reason in the work log.
template_id: resolve_pairwise
version: 1
kind: resolution_pairwise
description: >-
  Track #55, issue #61 (RF-6): the lines of the pairwise perception factors (docs/resolution.md,
  D2; docs/pairwise-factors.md). Each says how the observer sees one other person, so it goes
  into the observer's own view only, under that person's label in WHO YOU CAN SEE, and only while
  that person is in view. The core template (resolve_v2) places it verbatim, after the person's
  observable factor lines. Nobody is told how someone else sees them.
provenance: >-
  Issue #61's example lines, word for word. Perceived attractiveness is a matrix (who looks, who
  is seen) and need not be mutual; familiarity is the same for both. With a factor's visibility
  switch on, both of its levels have a line, so that "not attractive" is said as plainly as
  "attractive"; with it off there is no line at all. Nothing here names a scenario, a walking
  convention, a side or an order of passing, and no line says what the other person feels.

# One entry per pairwise factor (negsim/resolution/pairwise.py, LEVELS), one line per level, the
# levels in that order. "them" is the person the line is under.
lines:
  perceived_attractiveness:
    unremarkable: "You do not find them especially attractive."
    attractive: "You find them attractive."
  familiarity:
    strangers: "You have never seen them before."
    acquaintances: "You know each other from your classes."

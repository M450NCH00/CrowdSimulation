# Prompt template scenario_passing, version 1.  FROZEN — do not edit.
# The hash of this file is pinned in MANIFEST.json and checked every time it is loaded.
# To change any wording, copy the file to scenario_passing_v2.yaml, change it there, freeze
# it, and record the reason in the work log.
template_id: scenario_passing
version: 1
kind: resolution_scenario
description: >-
  The description side of the passing scenarios of rounds 1 to 3 of track #55 (head-on in a
  corridor, meeting in a narrow passage, someone behind says "excuse me"): the lines of the
  WHERE YOU ARE block and the until events of a passing encounter (docs/resolution.md, D1 and
  D16). The core template resolve_v1 holds nothing specific to a scenario; this file does.
provenance: >-
  Issue #57 (RF-2). The place lines are rulegen_negotiate_v2's place_passage, place_wall,
  place_open, place_narrowing, place_inside_narrowing and place_inside_passage, word for word,
  so that the place is told as it was in issue #32. The three events are those of D1. No
  extra block and no factor lines yet: situational factors are RF-5's, in a later version.

place:
  passage: "- You are in a passage {width} m wide. The wall on your left is {left} m from you, the wall on your right {right} m."
  wall: "- The nearest wall is {distance} m from you."
  open: "- There are no walls near you."
  narrowing: "- {distance} m ahead of you, the passage narrows to {width} m for {length} m."
  inside_narrowing: "- You are inside a stretch of the passage {width} m wide and {length} m long."
  inside_passage: "- You have walked {travelled} m into this stretch. Its end ahead of you is {ahead} m away, and the end behind you {behind} m."

# The until events of a passing encounter, in the order the reply format lists them, each with
# the words that tell the agent what it means. Their geometric definitions are RF-4's.
events:
  other_passes: until the other person has passed you
  other_stops: until the other person stops
  i_am_out_of_the_stretch: until you are out of the narrow stretch

# Blocks of this scenario's own beyond WHERE YOU ARE (for example YOUR QUEUE): none.
extra_blocks: {}

# This scenario's own factor lines (RF-5): none yet.
factor_lines: {}

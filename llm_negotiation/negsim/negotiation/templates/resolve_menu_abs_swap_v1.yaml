# Prompt template resolve_menu_abs_swap, version 1.  FROZEN — do not edit.
# The hash of this file is pinned in MANIFEST.json and checked every time it is loaded.
# To change any wording, copy the file to resolve_menu_abs_swap_v2.yaml, change it there, freeze it,
# and record the reason in the work log.
template_id: resolve_menu_abs_swap
version: 1
kind: resolution
description: >-
  Issue #138 (RF-49): resolve_menu_abs_v1 (issue #137, RF-48) with the two wall names exchanged.
  Wall a (+y) is "the yellow wall" and wall b (-y) "the blue wall"; every other word is
  resolve_menu_abs_v1's. Half of RF-49's absolute-frame sessions use it, so that which colour is on
  person 1's left is counterbalanced.
provenance: >-
  Issue #138 (RF-49), the user's decision of 2026-11-27 ("Counterbalance, same size"): in RF-52's
  grid (#141), both agents leaned to "the yellow wall" from an aligned start, with the blue wall
  always at +y. Written by exchanging the words "blue" and "yellow" everywhere below this header of
  resolve_menu_abs_v1, by script, so a prompt under this template is resolve_menu_abs_v1's prompt
  for the same session with the two words exchanged. The order of the options and of the names in
  each sentence follows the walls (a first), so it changes with the colours: the colour named first
  and the wall measured from is now yellow. The menu table is menu_table_abs_swap_v1.

# Issue #129: written for a paused exchange (protocol.exchange turn_taking). Issue #137: no note on
# which way a speaker faces (heard_frame is off).
exchange: turn_taking
# Issue #136: a reply names one option of this table, turned into steps by negsim.resolution.menu.
# Issue #137: its sidesteps go towards a wall.
menu_table: configs/resolution/menu_table_abs_swap_v1.yaml

# Issue #137: the corridor's own frame. Wall a is the long wall at +y, wall b the one at -y. Every
# view line that would say the agent's left or right says one of these instead.
walls:
  a: the yellow wall
  b: the blue wall

# Issue #137: WHERE YOU ARE lines that replace the scenario's own (scenario_passing_v1's passage
# line names the agent's left and right). {from_a} and {from_b}: from the agent's centre to each wall.
frame_place:
  passage: "- You are in a passage {width} m wide, between {wall_a} and {wall_b}. You are {from_a} m from {wall_a} and {from_b} m from {wall_b}."

system: |-
  {role}

  {instructions}

  {reply_format}

  {step_format}

role: |-
  You are playing the part of the person described below, on foot. Decide as this person would.

conditions:
  independent:
    instructions: |-
      Below you are told what you can see and hear around you right now. Say what you do from now on: how you move, chosen from the ACTIONS below.
      The passage has two long walls, the yellow wall and the blue wall. They are the same two walls for everyone here, so where people are and which way anyone moves is told by these walls.
      Other people see how you move, if you are in their view. Nobody else knows your intent or your reason.
    reply_format: |-
      HOW TO REPLY
      Reply with a single JSON object and nothing else, with these keys in this order:
      "intent": what you are trying to do, in your own words.
      "action": the one action you choose (see ACTIONS), written exactly as it is named there.
      "reason": why, in your own words. Nobody else sees it.
      The format, with placeholders: {"intent": "<what you are trying to do>", "action": "<the name of one action>", "reason": "<why>"}
    retry: >-
      Your last reply could not be read. Reply again with only a JSON object of the form
      {"intent": "<what you are trying to do>", "action": "<the name of one action, exactly as in ACTIONS>", "reason": "<why>"}.
  non_verbal:
    instructions: |-
      Below you are told what you can see and hear around you right now. Say what you do from now on: how you move, chosen from the ACTIONS below, and any signal you make.
      The passage has two long walls, the yellow wall and the blue wall. They are the same two walls for everyone here, so where people are and which way anyone moves is told by these walls.
      Other people see how you move and any signal you make, if you are in their view, and see your signal before they decide what to do. Nobody hears a signal. Nobody else knows your intent or your reason.
      You may be asked again later, if something changes.
    reply_format: |-
      HOW TO REPLY
      Reply with a single JSON object and nothing else, with these keys in this order:
      "signal": a signal you make now with your eyes, head or hands: "none", "eye_contact", "nod", "wave_on", "hold_up_hand", "point" or "other".
      "intent": what you are trying to do, in your own words.
      "action": the one action you choose (see ACTIONS), written exactly as it is named there.
      "reason": why, in your own words. Nobody else sees it.
      The format, with placeholders: {"signal": "<a signal, or none>", "intent": "<what you are trying to do>", "action": "<the name of one action>", "reason": "<why>"}
    retry: >-
      Your last reply could not be read. Reply again with only a JSON object of the form
      {"signal": "<a signal, or none>", "intent": "<what you are trying to do>", "action": "<the name of one action, exactly as in ACTIONS>", "reason": "<why>"}.
  talk:
    instructions: |-
      Below you are told what you can see and hear around you right now. Say what you do from now on: how you move, chosen from the ACTIONS below, anything you say out loud, and any signal you make.
      The passage has two long walls, the yellow wall and the blue wall. They are the same two walls for everyone here, so where people are and which way anyone moves is told by these walls.
      Everyone within hearing range of you hears what you say, whichever way they are facing. They hear all of it before they decide what to do. If you say which way you or anyone should go, name the wall: the yellow wall or the blue wall.
      Other people see how you move and any signal you make, if you are in their view, and see your signal before they decide what to do. Nobody hears a signal. Nobody else knows your intent or your reason.
      You may be asked again later, if something changes.
    reply_format: |-
      HOW TO REPLY
      Reply with a single JSON object and nothing else, with these keys in this order:
      "message": what you say out loud now, as plain text, or "" if you say nothing.
      "signal": a signal you make now with your eyes, head or hands: "none", "eye_contact", "nod", "wave_on", "hold_up_hand", "point" or "other".
      "intent": what you are trying to do, in your own words.
      "action": the one action you choose (see ACTIONS), written exactly as it is named there.
      "reason": why, in your own words. Nobody else sees it.
      The format, with placeholders: {"message": "<what you say, or nothing>", "signal": "<a signal, or none>", "intent": "<what you are trying to do>", "action": "<the name of one action>", "reason": "<why>"}
    retry: >-
      Your last reply could not be read. Reply again with only a JSON object of the form
      {"message": "<what you say, or nothing>", "signal": "<a signal, or none>", "intent": "<what you are trying to do>", "action": "<the name of one action, exactly as in ACTIONS>", "reason": "<why>"}.

  silent:
    instructions: |-
      Below you are told what you can see and hear around you right now. Say what you do from now on: how you move, chosen from the ACTIONS below.
      The passage has two long walls, the yellow wall and the blue wall. They are the same two walls for everyone here, so where people are and which way anyone moves is told by these walls.
      Other people see how you move, if you are in their view. Nobody else knows your intent or your reason.
      You may be asked again later, if something changes.
    reply_format: |-
      HOW TO REPLY
      Reply with a single JSON object and nothing else, with these keys in this order:
      "intent": what you are trying to do, in your own words.
      "action": the one action you choose (see ACTIONS), written exactly as it is named there.
      "reason": why, in your own words. Nobody else sees it.
      The format, with placeholders: {"intent": "<what you are trying to do>", "action": "<the name of one action>", "reason": "<why>"}
    retry: >-
      Your last reply could not be read. Reply again with only a JSON object of the form
      {"intent": "<what you are trying to do>", "action": "<the name of one action, exactly as in ACTIONS>", "reason": "<why>"}.

# Issue #136: the ACTIONS block, in place of resolve_v9's STEPS block. {events} is not used.
step_format: |-
  ACTIONS
  Choose one of these. You do it from now on, until it is done or you choose again. Write its name exactly as it is given in quotes.
  {actions}

# How an action is listed in the ACTIONS block: its name and its words.
action_item: '"{name}": {says}'

# The options, in this order, with the words the agent reads (no number, no angle). The table
# named by menu_table turns each into steps and must list the same names in the same order.
menu_options:
  carry on: keep walking along the line you are on, at your usual speed.
  slow down a little: keep walking along your line, a little slower than your usual speed, until the person you would meet has passed you.
  slow down a lot: keep walking along your line, much slower than your usual speed, until the person you would meet has passed you.
  stop and wait: stand still for a moment. Then you walk on along your line, unless you are asked again.
  step a little towards the yellow wall: move a little over towards the yellow wall as you walk, then walk on along that new line.
  step a little towards the blue wall: move a little over towards the blue wall as you walk, then walk on along that new line.
  step well towards the yellow wall: move well over towards the yellow wall as you walk, unless the wall stops you sooner, then walk on along that new line.
  step well towards the blue wall: move well over towards the blue wall as you walk, unless the wall stops you sooner, then walk on along that new line.
  step back: walk backwards a short way. Then you walk on along your line, unless you are asked again.

# How an until event is listed in the step format: its name and the scenario's words for it.
event_item: '"{name}" ({words})'

# The description of D2, block by block, in this order: ABOUT YOU, YOUR NOTES, WHERE YOU ARE
# (its lines are the scenario's), the scenario's own blocks, WHO YOU CAN SEE, WHAT YOU CAN
# HEAR, WHAT YOU HAVE DONE SO FAR, and the time to meet. An empty block is left out, except
# WHO YOU CAN SEE, which says when nobody is in view.
view:
  self_header: "ABOUT YOU"
  self_age: "- You are {age} years old."
  self_gender: "- You are {gender}."
  self_errand: "- You are on your way to {errand}."
  self_motion: "- You are walking at {speed} m/s. Your usual walking speed is {preferred} m/s."
  self_still: "- You are standing still. Your usual walking speed is {preferred} m/s."
  self_fastest: "- The fastest you can walk is {fastest} m/s."
  self_body: "- Your body is {width} m wide."
  notes_header: "YOUR NOTES"
  note: "- {note}"
  place_header: "WHERE YOU ARE"
  seen_header: "WHO YOU CAN SEE"
  seen_nobody: "- You do not see anyone nearby."
  seen_full: "- Person {n}, {distance} m away, {direction}."
  seen_motion: "  They are walking at {speed} m/s, {heading}, {change}."
  seen_still: "  They are standing still, facing {heading}."
  seen_backing: "  They are walking backwards at {speed} m/s, {change}."
  seen_body: "  Their body is {width} m wide."
  seen_age: "  They look about {age} years old."
  seen_gender: "  They look like {gender}."
  seen_signal: "  {signal}"
  seen_changes: "  Since you last looked, they have {changes}."
  seen_extra: "  {line}"
  seen_short: "- Person {n}, {distance} m away, {direction}: {motion}."
  # Issue #64: the other's age and gender under a short line, worded as seen_age and seen_gender.
  seen_short_age: "  They look about {age} years old."
  seen_short_gender: "  They look like {gender}."
  seen_short_signal: "  {signal}"
  # Issue #61: a factor line (RF-5's observable ones, RF-6's pairwise ones) under a short line.
  seen_short_extra: "  {line}"
  short_motion:
    walking: "walking {heading}"
    still: "standing still"
    backing: "walking backwards"
  heard_header: "WHAT YOU CAN HEAR"
  heard_seen: '- Person {n} says: "{message}"'
  heard_unseen: '- Someone behind you says: "{message}"'
  # A speaker the agent cannot see: where the voice came from, roughly, and how far.
  heard_unseen_from: '- Someone {direction}, {band}, says: "{message}"'
  # Issue #137: a voice from the agent's side comes from towards a wall.
  heard_directions:
    ahead: ahead of you
    behind: behind you
    left: "towards {wall} from you"
    right: "towards {wall} from you"
  heard_bands:
    close: close by
    far: further away
  history_header: "WHAT YOU HAVE DONE SO FAR"
  history_intent: '- {ago} s ago you decided: "{intent}"'
  history_said: '  You said: "{message}"'
  history_signal: "  {signal}"
  # What came of a decision: how far the agent has moved since towards a wall (issue #137).
  history_sideways: "  Since then you have moved {distance} m over towards {wall}."
  history_no_sideways: "  Since then you have not moved over to either side."
  history_back: "  You are now {distance} m further back than where you were then."
  history_outcome:
    completed: "  You have finished that."
    ongoing: "  You are still doing that."
    replaced: "  You changed that at your next decision."
  time_to_meet: "At your current speeds you would meet Person {n} in about {seconds} s."
  genders: {female: a woman, male: a man, nonbinary: a non-binary person}
  # Issue #137: ahead of, level with or behind the agent (level: 85° to 95° off where it faces), and
  # where across the passage, as the distance from the yellow wall.
  directions:
    ahead: "ahead of you, {from_a} m from {wall_a}"
    level: "level with you, {from_a} m from {wall_a}"
    behind: "behind you, {from_a} m from {wall_a}"
  # Issue #137: a drift or a crossing goes towards a wall.
  headings:
    same: in the same direction as you
    opposite: in the opposite direction to you
    across: "across your direction of travel towards {to_wall}, at {angle}° to it"
    # Issue #65: a walking person up to 45° off the opposite or the same direction is drifting.
    opposite_drifting: "in the opposite direction to you, drifting towards {to_wall} by {angle}°"
    same_drifting: "in the same direction as you, drifting towards {to_wall} by {angle}°"
  changes:
    shrinking: and the distance between you is shrinking
    not_shrinking: and the distance between you is not shrinking
  # What a person has done since the agent last looked (D5); joined with "and".
  since_last_look:
    slowed_down: slowed down
    sped_up: sped up
    stopped: stopped
    started_walking: started walking again
    backing_up: started walking backwards
    # Issue #137: towards the wall on that side of the agent.
    moved_left: "moved over towards {wall}"
    moved_right: "moved over towards {wall}"
    turned: changed direction
    came_into_view: just come into view
  # A signal the agent sees a person make.
  signals_seen:
    eye_contact: They are making eye contact with you.
    nod: They nod at you.
    wave_on: They wave you on.
    hold_up_hand: They hold up a hand.
    point: They point.
    other: They make a gesture.
  # A signal the agent made itself, in WHAT YOU HAVE DONE SO FAR.
  signals_made:
    eye_contact: You made eye contact.
    nod: You nodded.
    wave_on: You waved them on.
    hold_up_hand: You held up a hand.
    point: You pointed.
    other: You made a gesture.
  and: and

decision_point:
  opening: "What do you do now? Reply with the JSON object only."
  again: "Something has changed since you last decided. What do you do now? Your choice replaces whatever is left of your earlier one. Reply with the JSON object only."

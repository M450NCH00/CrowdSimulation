# Prompt template scenario_passing_group, version 1.  FROZEN — do not edit.
# The hash of this file is pinned in MANIFEST.json and checked every time it is loaded.
# To change any wording, copy the file to scenario_passing_group_v2.yaml, change it there, freeze
# it, and record the reason in the work log.
template_id: scenario_passing_group
version: 1
kind: resolution_scenario
description: >-
  The description side of small groups meeting head-on in round 1's corridor (issue #110, RF-32:
  2 v 1 and 2 v 2): scenario_passing_v1's place lines and events word for word, and one block of
  its own, WHO YOU ARE WITH, which tells a person walking side by side with someone that they are
  together and on which side (docs/resolution.md, D11 and D16).
provenance: >-
  Issue #110 (RF-32). Place lines and events: scenario_passing_v1, word for word, so that only the
  number of people and the companion block differ from round 1's pairs. The companion block is an
  assumption of the issue's build (WORK_LOG-110.md): someone walking abreast is at 90 degrees,
  outside the 75 degree view cone (D12), so without it a person would not know a friend is beside
  them. It names the side only, as the person knows it at the start; nobody is told that people
  coming the other way are together.

place:
  passage: "- You are in a passage {width} m wide. The wall on your left is {left} m from you, the wall on your right {right} m."
  wall: "- The nearest wall is {distance} m from you."
  open: "- There are no walls near you."
  narrowing: "- {distance} m ahead of you, the passage narrows to {width} m for {length} m."
  inside_narrowing: "- You are inside a stretch of the passage {width} m wide and {length} m long."
  inside_passage: "- You have walked {travelled} m into this stretch. Its end ahead of you is {ahead} m away, and the end behind you {behind} m."

events:
  other_passes: until the other person has passed you
  other_stops: until the other person stops
  i_am_out_of_the_stretch: until you are out of the narrow stretch

# Blocks of this scenario's own beyond WHERE YOU ARE: a person walking side by side with a friend.
extra_blocks:
  companion:
    header: "WHO YOU ARE WITH"
    line: "- You are out with a friend, walking side by side with them. They are on your {side}."

# This scenario's own factor lines: none.
factor_lines: {}
